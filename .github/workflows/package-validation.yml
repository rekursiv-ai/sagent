# DO NOT EDIT -- generated from package-validation.yml.tmpl and this
# package's sync config. Hand edits are overwritten; change
# the template, the generator, or the sync config instead.
name: Package validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Bounded so a hung step fails in minutes, not at the 6h default.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Outranks the checkout's .python-version, which pins a newer one.
          python-version: ${{ matrix.python-version }}
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-8787f28218a2ad65
      - name: Install system packages
        run: |
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update && break
            echo "apt-get update stalled (attempt $attempt)" >&2
            sleep $((attempt * 10))
          done
          timeout 300 sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Validate package
        # The same for every package; a package's own checks are its tests.
        run: |
          uv sync --frozen --all-groups
          SKIP=superseded-at-pre-push uv run pre-commit run --all-files --hook-stage pre-commit
          uv run pre-commit run --all-files --hook-stage pre-push

  validated:
    name: Lint, type-check, test, and build
    needs: validate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every version
        run: |
          test "${{ needs.validate.result }}" = success
