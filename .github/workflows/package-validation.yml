# DO NOT EDIT -- generated from package-validation.yml.tmpl and this
# package's sync config. Hand edits are overwritten; change
# the template, the generator, or the sync config instead.
name: Package validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Validate package
        run: |
          # Lint/type/test checks come from this package's own .pre-commit-config.yaml.
          # Restating each tool here means a newly added hook silently goes unrun.
          uv sync --frozen --all-groups --extra slack
          uv run pre-commit run --all-files --hook-stage pre-commit
          uv run pre-commit run --all-files --hook-stage pre-push
          uv run python -c "import sagent"
          uv build
          uv run python sagent/bin/check_wheel.py
