# DO NOT EDIT -- generated from package-validation.yml.tmpl and this
# package's sync config. Hand edits are overwritten; change
# the template, the generator, or the sync config instead.
name: Package validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    # Bounded so a hung step fails in minutes, not at the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Validate package
        run: |
          # Lint/type/test checks come from this package's own .pre-commit-config.yaml.
          # Restating each tool here means a newly added hook silently goes unrun.
          uv sync --frozen --all-groups --extra slack
          uv run pre-commit run --all-files --hook-stage pre-commit
          uv run pre-commit run --all-files --hook-stage pre-push
          uv run python -c "import sagent"
          rm -rf dist
          uv build --out-dir dist
          wheel="$(ls dist/sagent-*.whl | head -n 1)"; uv run --isolated --with "$wheel" python -P -c "import sagent; print(sagent.__file__)"
          uv run python sagent/bin/check_wheel.py
