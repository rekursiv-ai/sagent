name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish package to PyPI
    runs-on: ubuntu-latest
    # Bounded so a hung publish fails in minutes, not at the 6h default.
    timeout-minutes: 20
    environment: pypi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Build package
        run: uv build --out-dir dist

      - name: Validate built package
        run: |
          uv run python -c "import sagent; print(sagent.__file__)"
          uv run python sagent/bin/check_wheel.py

      # sagent tracks wesearch's main branch via [tool.uv.sources], so nothing
      # before this point proves the published dependency floor is sufficient.
      # Resolve the wheel against PyPI alone -- a symbol that exists only on
      # wesearch main fails HERE, before an irreversible upload, instead of in a
      # user's `pip install`.
      - name: Validate against published dependencies
        run: |
          wheels=(dist/sagent-*.whl)
          uv run --isolated --with "${wheels[0]}" python -P -c "import sagent"

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
