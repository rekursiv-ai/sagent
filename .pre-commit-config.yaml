# Universal Style and Quality Enforcement
# Pre-commit/pre-push checks _and_ source-of-truth for Github workflows.
#
# Usage:
#   The `precommit` dependency group supplies every tool the hooks below
#   invoke. [tool.uv] default-groups is unset, so name it -- an already-synced
#   .venv makes a bare `uv run` look fine and it is not reproducible on a
#   fresh checkout.
#
#     uv --quiet run --frozen --group pre-commit pre-commit install
#     uv --quiet run --frozen --group pre-commit pre-commit autoupdate
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#
#   May need: git config --unset-all core.hooksPath
#     if: [ERROR] Cowardly refusing to install hooks with `core.hooksPath` set.
#
#   Stages. `default_stages: [pre-commit]` below means a bare `run` sees only
#   the pre-commit hooks; the heavy ones (ty-check-global, basedpyright-global,
#   pytest*) declare `stages: [pre-push]` and need it named explicitly:
#
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files --hook-stage pre-push
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files --hook-stage commit-msg
#
#   Always pass --files or --all-files. Bare `run` (and the hook `git commit`
#   fires on a dirty tree) STASHES your changes -- a git mutation, and this
#   worktree is shared.
#
#   # Harvest all changed files from the perspective of CWD.
#     uv --quiet run --frozen --group pre-commit pre-commit run --files $(git --no-pager diff --name-only --diff-filter=d HEAD | sed "s|^|$(git rev-parse --show-cdup)|")
#
#   # Run only the files from the CWD.
#     uv --quiet run --frozen --group pre-commit pre-commit run --files $(git --no-pager diff --name-only --cached --relative | xargs)
#
#   One hook at a time, by id (`ruff-check`, `ty-check`, `pytest-global`, ...):
#     uv --quiet run --frozen --group pre-commit pre-commit run ruff-check --all-files
#     uv --quiet run --frozen --group pre-commit pre-commit run pytest-global --hook-stage pre-push
#
#   Individual tests: the pytest hooks take no test selector, so call pytest
#   directly.
#
#     uv --quiet run --frozen --group pre-commit pytest path/to/thing_test.py
#     uv --quiet run --frozen --group pre-commit pytest path/to/thing_test.py::test_name
#     uv --quiet run --frozen --group pre-commit pytest -k some_substring path/to/
#     uv --quiet run --frozen --group pre-commit pytest -n 6 path/to/
#
#   Marker tiers mirror the pytest-slow-global / -ci-smoke-global /
#   -integration-global hooks; the
#   default `-m` filter lives in pyproject addopts, so ask for them by name:
#
#     uv --quiet run --frozen --group pre-commit pytest -m slow path/to/
#
#   Skipping. SKIP takes hook ids, comma-separated, and reports "Skipped":
#
#     SKIP=ruff-check uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#     SKIP=pytest-global,pytest-slow-global uv --quiet run --frozen --group pre-commit pre-commit run --hook-stage pre-push --all-files
#
#   `git commit --no-verify` / `git push --no-verify` bypass every hook. Both
#   are a last resort, not a way past a red gate -- the gates are house rules
#   (see AGENTS.md "Never suppress gates"). Fix the code the hook protects.
#   The legitimate use is an unrelated pre-existing failure blocking an
#   urgent unrelated commit; say so in the commit message when you do it.
#
#
# On Source of Truthness:
#
#   Preferred location for any tool setting, in order:
#     pyproject.toml  >  .pre-commit-config.yaml  >  .github/workflows/tests.yml
#
#   Put a setting as high in this chain as the tool allows. Only drop to a
#   lower file when the higher one cannot express it (e.g. a CLI-only flag with
#   no config key). pyproject.toml holds tool config; .pre-commit-config.yaml
#   is the sole source for how hooks run (thread/worker counts, heap caps);
#   .github/workflows/tests.yml only invokes the hooks and must not redefine
#   any of these.
#
#
# Design Philosophy;
#
#   Only fail if there's things which cannot be auto-fixed.
#   Hooks fix files in place; if anything changes, pre-commit reports
#   "files were modified" and the commit is aborted. Run `git add -u`
#   then re-commit -- the second attempt always passes.
#
# See also:
#
#   https://pre-commit.com
#   https://pre-commit.com/hooks.html
#   https://learn.scientific-python.org/development/guides/style/

fail_fast: false
default_stages: [pre-commit]

repos:

  # === Pre-Commit Gates =======================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      - id: end-of-file-fixer
        name: end-of-file-fixer
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: trailing-whitespace
        name: trailing-whitespace
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: check-added-large-files
        name: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=750, --enforce-all]
        exclude: |
          (?x)^(
            uv\.lock
            |typings/
            |(.*/)?chrome/chrome_(desktop|android)_useragents\.txt
          )

      - id: check-merge-conflict
        name: check-merge-conflict
        stages: [pre-commit]
        args: [--assume-in-merge]

      - id: check-yaml
        name: check-yaml
        stages: [pre-commit]

      - id: check-toml
        name: check-toml
        stages: [pre-commit]

  # Type-checks `${{ }}` expressions, action inputs, runner labels, and shell in
  # `run:` blocks. A workflow expression error fails the job in 0 seconds with no
  # log, so nothing downstream catches it -- `check-yaml` above only proves the
  # file parses. The upstream hook self-selects on `^\.github/workflows/`.
  #
  # `actionlint`, not `actionlint-docker`/`-system`: the golang hook is the only
  # one that provisions itself. pre-commit bootstraps its own Go toolchain into
  # the hook env, whereas `-docker` needs a daemon this host does not run and
  # `-system` needs a manually installed binary -- both fail closed on a fresh
  # checkout, which is how the tool went uninstalled while the docs cited it.
  #
  # SC2016 is suppressed, and only SC2016: the export/import workflows pass
  # `--validation-command 'wheel="$wheel" ...'` deliberately single-quoted --
  # those `$` belong to the inner shell that runs the command later, so the
  # "expressions don't expand" advice inverts the intent. Every other shellcheck
  # rule stays live; note shellcheck runs only where it is installed, so this
  # hook is stricter on a CI runner than on a dev box without it.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-commit]
        args: [-ignore, "SC2016:"]

  # Validates uv.lock matches pyproject.toml (no network needed).
  # Run `uv lock` manually when changing dependencies.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:

      - id: uv-lock
        name: uv-lock
        stages: [pre-commit]
        files: ^(pyproject\.toml|uv\.lock)$

  - repo: local
    hooks:
      - id: codespell
        name: codespell
        language: system
        stages: [pre-commit]
        types_or: [python, markdown, jupyter, shell]
        entry: uv --quiet run --frozen --group pre-commit codespell
        args: [-w]
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
          )

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Exclusions defined in pyproject.toml.
      #
      # `require_serial: true` on both: ruff is rayon-parallel internally, so
      # pre-commit's own argv partitioning stacks cpu_count saturating processes
      # on top of it. Cheap here (ruff is sub-second on the whole tree) but the
      # same defect the `ty-check` and `basedpyright` hooks document.
      - id: ruff-check
        name: ruff-check
        stages: [pre-commit]
        require_serial: true
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        name: ruff-format
        stages: [pre-commit]
        require_serial: true
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      # No official ty pre-commit hook yet (https://github.com/astral-sh/ty/issues/269).
      # `require_serial: true` for the same reason as `basedpyright` below: ty
      # is rayon-parallel and saturates every core on its own (17 threads
      # measured for one invocation on a 16-core box). Left concurrent,
      # pre-commit partitions the argv into cpu_count chunks and runs them at
      # once, multiplying that by 16.
      - id: ty-check
        name: ty-check
        language: system
        stages: [pre-commit]
        require_serial: true
        # See `superseded-at-pre-push` at the head of the Pre-Push Gates section.
        alias: superseded-at-pre-push
        # Annoyingly there's no good choice.
        #   pass_filenames: true
        #     Pro: Only what you touch is checked.
        #     Con: pyproject.toml ``[tool.ty.src].exclude`` are ignored.
        #   pass_filenames: false
        #     Pro: pyproject.toml ``[tool.ty.src].exclude`` is honored.
        #     Con: repo-wide
        # Compromise: duplication; the exclusion list below must mirror
        # pyproject.toml's ``[tool.ty.src]``.
        types_or: [python, pyi]
        entry: uv --quiet run --frozen --group pre-commit ty check
        args:
          - --output-format
          - concise
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
            |(.*/)?docs/
          )

      # `basedpyright-global` at pre-push is the main gate; this is churn
      # reduction. Do not weaken the global one on the strength of this
      # passing.
      #
      # The exclude list mirrors pyproject.toml's `[tool.basedpyright] exclude`
      # because passing filenames makes basedpyright ignore it -- the same
      # duplication the `ty-check` hook above documents. Monorepo-only paths carry
      #
      # This hook DEFINES the `&worker-entry` wrapper every $WORKERS-sizing hook
      # shares -- a YAML anchor must be declared before it is referenced, and
      # this is the earliest user in document order. The wrapper sizes $WORKERS,
      # then runs the hook's own command line, supplied as the single `args`
      # entry. Per-hook differences (env vars, marker filters, exit-5 tolerance,
      # capability guards) live in that arg, so the arithmetic exists once.
      #
      # Filenames pre-commit appends reach the inner command as "$@": the
      # wrapper passes them after an explicit `bash` $0, because `bash -c "$@"`
      # would consume the first FILENAME as $0 and silently drop it from the
      # check. `pass_filenames: false` hooks see an empty "$@" and are unaffected.
      #
      # Inline rather than a script under ops/: this file is copied verbatim into
      # public package repos that do not receive ops/.
      #
      #   WORKERS = max(2, min(perf - 1, round(phys * 3/8)))
      #
      # `phys` counts physical cores (SMT siblings deduped); `perf` counts those
      # at the top clock -- equal to `phys` on a uniform-clock server, smaller on
      # a hybrid laptop. Both terms were fitted to measured optima, not derived:
      #
      #   host                     nproc  phys  perf  optimal  imputed
      #   tron (Core Ultra 7 255H)    16    16     6        5        5
      #   colossus (EPYC 9555)       128    64    64       24       24
      #
      # `optimal` is the measured best `pytest -n`, `imputed` what the formula
      # yields. tron: 5 -> 216s vs 6 -> 256s (653 slow tests, sequential, idle
      # box). colossus: 24 -> 105s vs 20 -> 113s (651 slow tests). tron has no
      # SMT, so nproc == phys; its 16 cores span three clock domains (6x5.1GHz,
      # 8x4.4GHz, 2x2.5GHz) and only the first counts as perf. colossus is
      # uniform at 3.25GHz, so perf == phys and `perf - 1` never binds there.
      #
      # `3/8` binds on the server, `perf - 1` only on a power-capped hybrid, `2`
      # only on a 2-vCPU CI runner. On 2 pinned cores xdist still beats serial
      # (n=2 5.4s vs n=0 6.4s), so the floor is 2 and never 1.
      #
      # Every structural alternative overshot at least one box: physical cores,
      # top frequency domain, and nproc/2 all did. Do NOT "simplify" this back to
      # a core count. Note also that the EPYC curve is a sawtooth (24 and 32
      # fast, 20 and 28 slow, likely CCD alignment), so a nearby value is not
      # interchangeable.
      #
      # Set WORKERS in the environment to override on a host that measures
      # differently; the formula only runs when it is unset.
      # `require_serial: true` because this hook already parallelizes itself.
      # Without it pre-commit splits the argv into ~cpu_count partitions and runs
      # them CONCURRENTLY, each an independent basedpyright with its own
      # `--threads=$WORKERS` -- so a 500-file changeset launched 18 processes and
      # ~96 Node workers on a 16-core box. $WORKERS is the intended cap; serial
      # partitioning is what makes it one.
      - id: basedpyright
        name: basedpyright
        language: system
        stages: [pre-commit]
        require_serial: true
        # See `superseded-at-pre-push` at the head of the Pre-Push Gates section.
        alias: superseded-at-pre-push
        types_or: [python, pyi]
        entry: &worker-entry >-
          bash -c '
            if [ -z "$WORKERS" ]; then
              cpu=/sys/devices/system/cpu;
              if [ -d "$cpu/cpu0/topology" ]; then
                phys=$(cat $cpu/cpu*/topology/core_id 2>/dev/null | sort -u | wc -l);
                top=$(sort -rn $cpu/cpu*/cpufreq/cpuinfo_max_freq 2>/dev/null | head -1);
                perf=$([ -n "$top" ] && grep -lx "$top" $cpu/cpu*/cpufreq/cpuinfo_max_freq | xargs -n1 dirname | xargs -n1 dirname | xargs -I@ cat @/topology/core_id | sort -u | wc -l || echo "$phys");
              else
                phys=$(sysctl -n hw.physicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN);
                perf=0;
                for i in $(seq 0 $(( $(sysctl -n hw.nperflevels 2>/dev/null || echo 1) - 1 ))); do
                  [ "$(sysctl -n hw.perflevel$i.name 2>/dev/null)" = Efficiency ] && continue;
                  perf=$(( perf + $(sysctl -n hw.perflevel$i.physicalcpu 2>/dev/null || echo 0) ));
                done;
                ((perf < 1)) && perf=$phys;
              fi;
              WORKERS=$(( (phys * 3 + 4) / 8 ));
              ((WORKERS > perf - 1)) && WORKERS=$(( perf - 1 ));
              ((WORKERS < 2)) && WORKERS=2;
              # max(2, min(perf - 1, round(phys * 3/8))); +4 rounds to nearest.
            fi;
            export WORKERS;
            exec bash -c "$1" bash "${@:2}"
          ' bash
        args:
          - >-
            exec env NODE_OPTIONS=--max-old-space-size=2048
            uv --quiet run --frozen --group pre-commit
            basedpyright --threads="$WORKERS" "$@"
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
          )

      # Runs the test file that PAIRS with each changed source file -- nothing
      # transitive. ~1s, versus 120s for the pre-push `pytest-global` hook's testmon walk.
      #
      # Deliberately not an affected-set analysis. Measured on this repo, the
      # reverse-import closure of a 42-file changeset is 2482 files / 1124 test
      # files (39% of the tree), because one touched module has 212 importers --
      # import reachability is not behavioral dependence. `--testmon-forceselect`
      # at pre-push already selects precisely, from coverage.
      #
      # Both sidecar spellings and a mirrored tests/ tree are probed, so the hook
      # is not specific to this repo's layout. On a layout matching none of them it
      # runs nothing and exits 0 -- a green here means "no paired test found", not
      # "tested". That is only acceptable because pre-push is the real gate.
      #
      # Tolerate pytest exit 5 (nothing collected) for the same reason the
      # pre-push tiers do: a paired test file whose every test carries a
      # deselected marker (`integration`, `slow`) collects zero, which is not a
      # failure. Editing `chrome/echo.py` reported RED on a sidecar of seven
      # passing integration tests. A REAL failure is exit 1 and still fails.
      #
      # Parallelism is chosen from the changeset size, because neither setting
      # wins everywhere. xdist costs a fixed ~5s of worker startup, and a
      # sidecar file is ~0.23s serial vs ~0.10s spread over workers, so the two
      # curves cross. Measured on tron (WORKERS=5), sidecar files -> wall:
      #
      #   files    8    12    16    20    60
      #   serial  5.7s  7.6s  6.8s  12.4s 27.8s
      #   -n5     8.1s  9.0s  7.5s   8.0s 16.3s
      #
      # Below ~16 serial wins by up to 40%; above ~20 xdist wins by 1.7x. The
      # threshold sits at the crossover, one below the first size where -n won,
      # so a typical few-file commit -- the case this fast tier exists for --
      # never pays startup, and a sweeping refactor still gets the workers.
      # SIDECAR_XDIST_MIN overrides it on a host that measures differently.
      #
      # `read -d ''`, not `mapfile`: mapfile is bash 4.0 and macOS ships 3.2.
      # `printf '\0'` supplies the NUL, so read exits 0 instead of on EOF.
      #
      # `require_serial: true` is a separate axis and is always right here:
      # it governs pre-commit's OWN argv partitioning, which forks cpu_count
      # copies of this whole hook. That multiplies the startup cost the
      # threshold above exists to avoid, and it stacks on any `-n` we choose --
      # 60 files as 16 forked hooks burned 73s of CPU for 16.3s of wall, the
      # same wall as one hook at -n5 for 36s. One hook, sized once.
      - id: pytest
        name: pytest
        language: system
        stages: [pre-commit]
        require_serial: true
        # See `superseded-at-pre-push` at the head of the Pre-Push Gates section.
        alias: superseded-at-pre-push
        types: [python]
        entry: *worker-entry
        args:
          - >-
            tests=();
            for f in "$@"; do
              dir=$(dirname "$f");
              stem=$(basename "$f" .py); stem=${stem%_test}; stem=${stem#test_};
              for cand in "$dir/${stem}_test.py" "$dir/test_${stem}.py" \
                          "tests/${dir#src/}/${stem}_test.py" \
                          "tests/${dir#src/}/test_${stem}.py"; do
                [ -f "$cand" ] && tests+=("$cand");
              done;
            done;
            [ ${#tests[@]} -eq 0 ] && exit 0;
            IFS=$'\n' read -r -d '' -a tests < <(printf "%s\n" "${tests[@]}" | sort -u && printf '\0');
            dist=();
            ((${#tests[@]} >= ${SIDECAR_XDIST_MIN:-16})) && dist=(-n "$WORKERS");
            uv --quiet run --frozen --group pre-commit pytest "${dist[@]}" -q --tb=short "${tests[@]}"
            || test "$?" = 5

  # === Pre-Push Gates =========================================================
  # To enable:  uv run pre-commit install --hook-type pre-push
  # To disable: uv run pre-commit uninstall --hook-type pre-push
  #
  # Three pre-commit hooks above are churn reduction only -- `ty-check`,
  # `basedpyright` and `pytest` each answer a strictly weaker question
  # than a hook below (`ty-check-global`, `basedpyright-global`,
  # `pytest-global`). They carry `alias: superseded-at-pre-push`, which is a
  # plain `SKIP=` selector: a lane that already runs the pre-push tier sets that
  # and drops all three in one token, without restating hook ids where they
  # could drift. pre-commit accepts the same alias on several hooks and skips
  # every one of them.
  #
  # This is not cosmetic. The per-file `basedpyright` turned repo-wide when CI's
  # periodic lane ran the commit stage `--all-files` -- passing filenames also
  # voids pyproject's excludes -- and on a 2-vCPU runner ($WORKERS floors at 2)
  # it blew the 30-minute job cap while `basedpyright-global` had already
  # answered the same question in 12 minutes in its own job.
  #
  # These sections are NOT independent: every `*worker-entry` below resolves the
  # anchor DEFINED on the pre-commit `basedpyright` hook above. Deleting or
  # reordering that hook past these is a YAML error, not a silent regression --
  # `precommit_regex_test.py` also asserts all six entries stay byte-identical,
  # so copy-pasting the wrapper in place of a reference fails.

  - repo: local
    hooks:
      - id: ty-check-global
        name: ty-check-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: uv --quiet run --frozen --group pre-commit ty check
        # Exclusions defined in pyproject.toml.

      - id: basedpyright-global
        name: basedpyright-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: *worker-entry
        args:
          - >-
            exec env NODE_OPTIONS=--max-old-space-size=2048
            uv --quiet run --frozen --group pre-commit
            basedpyright --threads="$WORKERS"

      - id: pytest-global
        name: pytest-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # --testmon-forceselect runs only tests whose covered code changed since
        # the cached .testmondata baseline (huge speedup on the full suite).
        # It must be -forceselect, NOT plain --testmon: this repo's pyproject
        # addopts carries a default `-m 'not ci_smoke and ...'` marker filter,
        # and plain --testmon silently self-deactivates whenever -m is present
        # (tarpas/pytest-testmon#238). -forceselect overrides that. On a cache
        # miss / new environment testmon runs the whole suite, so it is fail-safe.
        # COVERAGE_CORE=ctrace: coverage defaults to core=sysmon on 3.14, which
        # cannot carry the dynamic contexts testmon switches per test. Testmon
        # builds Coverage with config_file=False, so only the env var reaches it.
        entry: *worker-entry
        args:
          - >-
            exec env COVERAGE_CORE=ctrace uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" -q --tb=short --testmon-forceselect

      - id: pytest-slow-global
        name: pytest-slow-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # --no-cov only when pytest-cov is installed: the flag is an error
        # without the plugin, and these tiers gain nothing from coverage
        # (only the testmon hook above needs it).
        #
        # Tolerate pytest exit 5 (no tests collected): a tree may ship no tests
        # for this marker, which is not a failure. The strict `pytest-global` hook
        # above still fails on an empty collection, and
        # ops/github/marker_tiers_test.py fails any tier that goes empty
        # without being declared empty -- so tolerance here is not fail-open.
        entry: *worker-entry
        args:
          - >-
            cov=();
            uv --quiet run --frozen --group pre-commit
            python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" -q --tb=short
            -m "slow and not cluster and not cuda and not integration and not performance"
            || test "$?" = 5

      - id: pytest-ci-smoke-global
        name: pytest-ci-smoke-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Slower package/CLI smoke tests, deselected by the pyproject marker
        # filter. Tolerate pytest exit 5 (no tests collected) so the hook does
        # not fail a tree that happens to ship none.
        entry: *worker-entry
        args:
          - >-
            cov=();
            uv --quiet run --frozen --group pre-commit
            python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" -q --tb=short --durations=20
            -m ci_smoke || test "$?" = 5

      - id: pytest-integration-global
        name: pytest-integration-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Gated on the CAPABILITY, not an env var: these tests need a real
        # Postgres, so skip when `pg_config` is absent and RUN it when the
        # toolchain is there. An RUN_INTEGRATION=1 opt-in meant the pgvector
        # this image installs was provisioned and never exercised.
        #
        # `pg_config` present but pgvector missing still fails loudly ("extension
        # \"vector\" is not available") -- that is a broken provision, not a
        # machine without a database, and should not be silently skipped.
        #
        # Tolerate pytest exit 5: see the pytest-slow-global note above.
        entry: *worker-entry
        args:
          - >-
            command -v pg_config >/dev/null 2>&1 || exit 0;
            cov=();
            uv --quiet run --frozen --group pre-commit
            python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" -q --tb=short --dist=loadgroup
            -m integration || test "$?" = 5
