# Universal Style and Quality Enforcement
# Pre-commit/pre-push checks _and_ source-of-truth for Github workflows.
#
# Usage:
#   The `precommit` dependency group supplies every tool the hooks below
#   invoke. [tool.uv] default-groups is unset, so name it -- an already-synced
#   .venv makes a bare `uv run` look fine and it is not reproducible on a
#   fresh checkout.
#
#     uv --quiet run --frozen --group pre-commit pre-commit install
#     uv --quiet run --frozen --group pre-commit pre-commit autoupdate
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#
#   May need: git config --unset-all core.hooksPath
#     if: [ERROR] Cowardly refusing to install hooks with `core.hooksPath` set.
#
#   Stages. `default_stages: [pre-commit]` below means a bare `run` sees only
#   the pre-commit hooks; the heavy ones (ty-global, basedpyright-global,
#   pytest*) declare `stages: [pre-push]` and need it named explicitly:
#
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files --hook-stage pre-push
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files --hook-stage commit-msg
#
#   Always pass --files or --all-files. Bare `run` (and the hook `git commit`
#   fires on a dirty tree) STASHES your changes -- a git mutation, and this
#   worktree is shared.
#
#     uv --quiet run --frozen --group pre-commit pre-commit run \
#       --files $(git status --short | awk '{print $2}')
#
#     # Or to just pre-commit on .
#     uv --quiet run --frozen --group pre-commit pre-commit run \
#       --files $(git diff --name-only --cached --relative | xargs)
#
#   One hook at a time, by id (`ruff-check`, `ty`, `pytest`, ...):
#     uv --quiet run --frozen --group pre-commit pre-commit run ruff-check --all-files
#     uv --quiet run --frozen --group pre-commit pre-commit run pytest --hook-stage pre-push
#
#   Individual tests: the pytest hooks take no test selector, so call pytest
#   directly.
#
#     uv --quiet run --frozen --group pre-commit pytest path/to/thing_test.py
#     uv --quiet run --frozen --group pre-commit pytest path/to/thing_test.py::test_name
#     uv --quiet run --frozen --group pre-commit pytest -k some_substring path/to/
#     uv --quiet run --frozen --group pre-commit pytest -n 6 path/to/
#
#   Marker tiers mirror the pytest-slow / -ci-smoke / -integration hooks; the
#   default `-m` filter lives in pyproject addopts, so ask for them by name:
#
#     uv --quiet run --frozen --group pre-commit pytest -m slow path/to/
#
#   Skipping. SKIP takes hook ids, comma-separated, and reports "Skipped":
#
#     SKIP=ruff-check uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#     SKIP=pytest,pytest-slow uv --quiet run --frozen --group pre-commit pre-commit run --hook-stage pre-push --all-files
#
#   `git commit --no-verify` / `git push --no-verify` bypass every hook. Both
#   are a last resort, not a way past a red gate -- the gates are house rules
#   (see AGENTS.md "Never suppress gates"). Fix the code the hook protects.
#   The legitimate use is an unrelated pre-existing failure blocking an
#   urgent unrelated commit; say so in the commit message when you do it.
#
#
# On Source of Truthness:
#
#   Preferred location for any tool setting, in order:
#     pyproject.toml  >  .pre-commit-config.yaml  >  .github/workflows/tests.yml
#
#   Put a setting as high in this chain as the tool allows. Only drop to a
#   lower file when the higher one cannot express it (e.g. a CLI-only flag with
#   no config key). pyproject.toml holds tool config; .pre-commit-config.yaml
#   is the sole source for how hooks run (thread/worker counts, heap caps);
#   .github/workflows/tests.yml only invokes the hooks and must not redefine
#   any of these.
#
#
# Design Philosophy;
#
#   Only fail if there's things which cannot be auto-fixed.
#   Hooks fix files in place; if anything changes, pre-commit reports
#   "files were modified" and the commit is aborted. Run `git add -u`
#   then re-commit -- the second attempt always passes.
#
# See also:
#
#   https://pre-commit.com
#   https://pre-commit.com/hooks.html
#   https://learn.scientific-python.org/development/guides/style/

fail_fast: false
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=750, --enforce-all]
        exclude: |
          (?x)^(
            uv\.lock
            |typings/
            |(.*/)?chrome/chrome_(desktop|android)_useragents\.txt
          )

      - id: check-merge-conflict
        stages: [pre-commit]
        args: [--assume-in-merge]

      - id: check-yaml
        stages: [pre-commit]

      - id: check-toml
        stages: [pre-commit]

  # Type-checks `${{ }}` expressions, action inputs, runner labels, and shell in
  # `run:` blocks. A workflow expression error fails the job in 0 seconds with no
  # log, so nothing downstream catches it -- `check-yaml` above only proves the
  # file parses. The upstream hook self-selects on `^\.github/workflows/`.
  #
  # `actionlint`, not `actionlint-docker`/`-system`: the golang hook is the only
  # one that provisions itself. pre-commit bootstraps its own Go toolchain into
  # the hook env, whereas `-docker` needs a daemon this host does not run and
  # `-system` needs a manually installed binary -- both fail closed on a fresh
  # checkout, which is how the tool went uninstalled while the docs cited it.
  #
  # SC2016 is suppressed, and only SC2016: the export/import workflows pass
  # `--validation-command 'wheel="$wheel" ...'` deliberately single-quoted --
  # those `$` belong to the inner shell that runs the command later, so the
  # "expressions don't expand" advice inverts the intent. Every other shellcheck
  # rule stays live; note shellcheck runs only where it is installed, so this
  # hook is stricter on a CI runner than on a dev box without it.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]
        args: [-ignore, "SC2016:"]

  # Validates uv.lock matches pyproject.toml (no network needed).
  # Run `uv lock` manually when changing dependencies.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:

      - id: uv-lock
        stages: [pre-commit]
        files: ^(pyproject\.toml|uv\.lock)$

  - repo: local
    hooks:

      - id: codespell
        name: codespell
        language: system
        stages: [pre-commit]
        types_or: [python, markdown, jupyter, shell]
        entry: uv --quiet run --frozen --group pre-commit codespell
        args: [-w]
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
          )

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Exclusions defined in pyproject.toml.
      - id: ruff-check
        stages: [pre-commit]
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit]
        types_or: [python, pyi, jupyter]

  # No official ty pre-commit hook yet (https://github.com/astral-sh/ty/issues/269).
  - repo: local
    hooks:
      - id: ty
        name: ty check
        language: system
        stages: [pre-commit]
        # Annoyingly there's no good choice.
        #   pass_filenames: true
        #     Pro: Only what you touch is checked.
        #     Con: pyproject.toml ``[tool.ty.src].exclude`` are ignored.
        #   pass_filenames: false
        #     Pro: pyproject.toml ``[tool.ty.src].exclude`` is honored.
        #     Con: repo-wide
        # Compromise: duplication; the exclusion list below must mirror
        # pyproject.toml's ``[tool.ty.src]``.
        types_or: [python, pyi]
        entry: uv --quiet run --frozen --group pre-commit ty check
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
            |(.*/)?docs/
          )

  # To enable:  uv run pre-commit install --hook-type pre-push
  # To disable: uv run pre-commit uninstall --hook-type pre-push
  - repo: local
    hooks:
      - id: ty-global
        name: ty check global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: uv --quiet run --frozen --group pre-commit ty check
        # Exclusions defined in pyproject.toml.

  # Every heavy pre-push hook below shares this one wrapper. It sizes $WORKERS,
  # then runs the hook's own command line -- supplied as the single `args`
  # entry. Per-hook differences (env vars, marker filters, exit-5 tolerance,
  # capability guards) live in that arg, so the arithmetic exists exactly once.
  #
  # Inline rather than a script under ops/: this file is copied verbatim into
  # public package repos that do not receive ops/.
  #
  #   WORKERS = max(2, min(perf - 1, round(phys * 3/8)))
  #
  # `phys` counts physical cores (SMT siblings deduped); `perf` counts those at
  # the top clock -- equal to `phys` on a uniform-clock server, smaller on a
  # hybrid laptop. Both terms were fitted to measured optima, not derived:
  #
  #   host                     nproc  phys  perf  optimal  imputed
  #   tron (Core Ultra 7 255H)    16    16     6        5        5
  #   colossus (EPYC 9555)       128    64    64       24       24
  #
  # `optimal` is the measured best `pytest -n`, `imputed` what the formula
  # yields. tron: 5 -> 216s vs 6 -> 256s (653 slow tests, sequential, idle box).
  # colossus: 24 -> 105s vs 20 -> 113s (651 slow tests). tron has no SMT, so
  # nproc == phys; its 16 cores span three clock domains (6x5.1GHz, 8x4.4GHz,
  # 2x2.5GHz) and only the first counts as perf. colossus is uniform at
  # 3.25GHz, so perf == phys and the `perf - 1` term never binds there.
  #
  # `3/8` binds on the server, `perf - 1` only on a power-capped hybrid, `2`
  # only on a 2-vCPU CI runner. On 2 pinned cores xdist still beats serial
  # (n=2 5.4s vs n=0 6.4s), so the floor is 2 and never 1.
  #
  # Every structural alternative overshot at least one box: physical cores, top
  # frequency domain, and nproc/2 all did. Do NOT "simplify" this back to a core
  # count. Note also that the EPYC curve is a sawtooth (24 and 32 fast, 20 and
  # 28 slow, likely CCD alignment), so a nearby value is not interchangeable.
  #
  # Set WORKERS in the environment to override on a host that measures
  # differently; the formula only runs when it is unset.
  - repo: local
    hooks:
      - id: basedpyright-global
        name: basedpyright-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: &worker-entry >-
          bash -c '
            if [ -z "$WORKERS" ]; then
              cpu=/sys/devices/system/cpu;
              if [ -d "$cpu/cpu0/topology" ]; then
                phys=$(cat $cpu/cpu*/topology/core_id 2>/dev/null | sort -u | wc -l);
                top=$(sort -rn $cpu/cpu*/cpufreq/cpuinfo_max_freq 2>/dev/null | head -1);
                perf=$([ -n "$top" ] && grep -lx "$top" $cpu/cpu*/cpufreq/cpuinfo_max_freq | xargs -n1 dirname | xargs -n1 dirname | xargs -I@ cat @/topology/core_id | sort -u | wc -l || echo "$phys");
              else
                phys=$(sysctl -n hw.physicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN);
                perf=0;
                for i in $(seq 0 $(( $(sysctl -n hw.nperflevels 2>/dev/null || echo 1) - 1 ))); do
                  [ "$(sysctl -n hw.perflevel$i.name 2>/dev/null)" = Efficiency ] && continue;
                  perf=$(( perf + $(sysctl -n hw.perflevel$i.physicalcpu 2>/dev/null || echo 0) ));
                done;
                ((perf < 1)) && perf=$phys;
              fi;
              WORKERS=$(( (phys * 3 + 4) / 8 ));
              ((WORKERS > perf - 1)) && WORKERS=$(( perf - 1 ));
              ((WORKERS < 2)) && WORKERS=2;
              # max(2, min(perf - 1, round(phys * 3/8))); +4 rounds to nearest.
            fi;
            export WORKERS;
            exec bash -c "$@"
          ' bash
        args:
          - >-
            exec env NODE_OPTIONS=--max-old-space-size=2048
            uv --quiet run --frozen --group pre-commit
            basedpyright --threads="$WORKERS"

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # --testmon-forceselect runs only tests whose covered code changed since
        # the cached .testmondata baseline (huge speedup on the full suite).
        # It must be -forceselect, NOT plain --testmon: this repo's pyproject
        # addopts carries a default `-m 'not ci_smoke and ...'` marker filter,
        # and plain --testmon silently self-deactivates whenever -m is present
        # (tarpas/pytest-testmon#238). -forceselect overrides that. On a cache
        # miss / new environment testmon runs the whole suite, so it is fail-safe.
        # COVERAGE_CORE=ctrace: coverage defaults to core=sysmon on 3.14, which
        # cannot carry the dynamic contexts testmon switches per test. Testmon
        # builds Coverage with config_file=False, so only the env var reaches it.
        entry: *worker-entry
        args:
          - >-
            exec env COVERAGE_CORE=ctrace uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" -q --tb=short --testmon-forceselect

      - id: pytest-slow
        name: pytest (slow)
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # --no-cov only when pytest-cov is installed: the flag is an error
        # without the plugin, and these tiers gain nothing from coverage
        # (only the testmon hook above needs it).
        #
        # Tolerate pytest exit 5 (no tests collected): a tree may ship no tests
        # for this marker, which is not a failure. The strict `pytest` hook
        # above still fails on an empty collection, and
        # ops/github/marker_tiers_test.py fails any tier that goes empty
        # without being declared empty -- so tolerance here is not fail-open.
        entry: *worker-entry
        args:
          - >-
            cov=();
            uv --quiet run --frozen --group pre-commit
            python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" -q --tb=short
            -m "slow and not cluster and not cuda and not integration and not performance"
            || test "$?" = 5

      - id: pytest-ci-smoke
        name: pytest (ci_smoke)
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Slower package/CLI smoke tests, deselected by the pyproject marker
        # filter. Tolerate pytest exit 5 (no tests collected) so the hook does
        # not fail a tree that happens to ship none.
        entry: *worker-entry
        args:
          - >-
            cov=();
            uv --quiet run --frozen --group pre-commit
            python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" -q --tb=short --durations=20
            -m ci_smoke || test "$?" = 5

      - id: pytest-integration
        name: pytest (integration)
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Gated on the CAPABILITY, not an env var: these tests need a real
        # Postgres, so skip when `pg_config` is absent and RUN it when the
        # toolchain is there. An RUN_INTEGRATION=1 opt-in meant the pgvector
        # this image installs was provisioned and never exercised.
        #
        # `pg_config` present but pgvector missing still fails loudly ("extension
        # \"vector\" is not available") -- that is a broken provision, not a
        # machine without a database, and should not be silently skipped.
        #
        # Tolerate pytest exit 5: see the pytest-slow note above.
        entry: *worker-entry
        args:
          - >-
            command -v pg_config >/dev/null 2>&1 || exit 0;
            cov=();
            uv --quiet run --frozen --group pre-commit
            python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" -q --tb=short --dist=loadgroup
            -m integration || test "$?" = 5
