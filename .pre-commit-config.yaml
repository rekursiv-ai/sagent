# See:
#   https://pre-commit.com
#   https://pre-commit.com/hooks.html
#   https://learn.scientific-python.org/development/guides/style/
# uv run pre-commit install
# uv run pre-commit autoupdate
# uv run pre-commit run --all-files
#
# May need: git config --unset-all core.hooksPath
# if: [ERROR] Cowardly refusing to install hooks with `core.hooksPath` set.

# Tool settings: single source of truth.
# Preferred location for any tool setting, in order:
#   pyproject.toml  >  .pre-commit-config.yaml  >  .github/workflows/tests.yml
# Put a setting as high in this chain as the tool allows. Only drop to a lower
# file when the higher one cannot express it (e.g. a CLI-only flag with no
# config key). pyproject.toml holds tool config; .pre-commit-config.yaml is the
# sole source for how hooks run (thread/worker counts, heap caps);
# .github/workflows/tests.yml only invokes the hooks and must not redefine any
# of these.
#
# Philosophy: Only fail if there's things which cannot be auto-fixed.
# Hooks fix files in place; if anything changes, pre-commit reports
# "files were modified" and the commit is aborted. Run `git add -u`
# then re-commit -- the second attempt always passes.
fail_fast: false
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=500, --enforce-all]
        # No leading `|` inside the group: an empty first alternative matches
        # every path at position zero, which silently excluded the whole tree
        # and disabled this gate entirely.
        exclude: |
          (?x)^(
            typings/
            |uv\.lock
            # Vendored User-Agent pools: generated by ops/github/
            # update_useragents.py and committed on purpose so the published
            # package ships reviewed static data instead of fetching at
            # runtime. The monorepo config excludes the same file by its
            # source path; this is its exported path.
            |(.*/)?chrome/chrome_(desktop|android)_useragents\.txt
          )

      - id: check-merge-conflict
        stages: [pre-commit]
        args: [--assume-in-merge]

      - id: check-yaml
        stages: [pre-commit]

      - id: check-toml
        stages: [pre-commit]

  # Validates uv.lock matches pyproject.toml (no network needed).
  # Run `uv lock` manually when changing dependencies.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:
      - id: uv-lock
        stages: [pre-commit]
        files: ^(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Exclusions defined in pyproject.toml.
      - id: ruff-check
        stages: [pre-commit]
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit]
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:

      - id: codespell
        name: codespell
        language: system
        stages: [pre-commit]
        types_or: [python, markdown, jupyter, shell]
        entry: uv --quiet run --frozen --group lint codespell
        args: [-w]
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
          )

  # No official ty pre-commit hook yet (https://github.com/astral-sh/ty/issues/269).
  - repo: local
    hooks:
      - id: ty
        name: ty check
        language: system
        stages: [pre-commit]
        # Annoyingly there's no good choice.
        #   pass_filenames: true
        #     Pro: Only what you touch is checked.
        #     Con: pyproject.toml ``[tool.ty.src].exclude`` are ignored.
        #   pass_filenames: false
        #     Pro: pyproject.toml ``[tool.ty.src].exclude`` is honored.
        #     Con: repo-wide
        # Compromise: duplication; the exclusion list below must mirror
        # pyproject.toml's ``[tool.ty.src]``.
        types_or: [python, pyi]
        entry: uv --quiet run --frozen --group typecheck ty check
        # The comment above is exactly why this list exists. With filenames
        # passed, ty never applies [tool.ty.src].exclude, so claiming
        # "exclusions defined in pyproject.toml" was false: configgle excludes
        # docs/ there, this hook checked it anyway, and every export failed on
        # reveal_type() calls that are the documentation's whole point.
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
            |(.*/)?docs/
          )

  # To enable:  uv run pre-commit install --hook-type pre-push
  # To disable: uv run pre-commit uninstall --hook-type pre-push
  - repo: local
    hooks:
      - id: ty-global
        name: ty check global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: uv --quiet run --frozen --group typecheck ty check
        # Exclusions defined in pyproject.toml.

  - repo: local
    hooks:
      - id: basedpyright-global
        name: basedpyright-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: >-
          bash -c '
            workers=$(nproc);
            workers=$((workers / 2));
            ((workers < 2)) && workers=2;
            ((workers > 32)) && workers=32;
            exec env NODE_OPTIONS=--max-old-space-size=2048 \
            uv --quiet run --frozen --group typecheck \
            basedpyright --threads="$workers"
          '

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # --testmon-forceselect runs only tests whose covered code changed since
        # the cached .testmondata baseline. It must be -forceselect, NOT plain
        # --testmon: pyproject addopts carries a default `-m` marker filter, and
        # plain --testmon self-deactivates whenever -m is present
        # (tarpas/pytest-testmon#238). On a cache miss testmon runs everything,
        # so it is fail-safe.
        entry: &pytest-entry >-
          bash -c '
            workers=$(nproc);
            workers=$((workers / 2));
            ((workers < 2)) && workers=2;
            ((workers > 32)) && workers=32;
            exec uv --quiet run --frozen --group test \
            pytest -n="$workers" "$@"
          ' pytest
        args: [-q, --tb=short, --testmon-forceselect]

      - id: pytest-slow
        name: pytest (slow)
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Tolerate pytest exit 5 (no tests collected): this package may ship no
        # tests for this marker, which is not a failure. Regular pytest stays strict.
        entry: >-
          bash -c '
            workers=$(nproc);
            workers=$((workers / 2));
            ((workers < 2)) && workers=2;
            ((workers > 32)) && workers=32;
            cov=();
            uv --quiet run --frozen --group test \
              python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group test \
            pytest -n="$workers" "${cov[@]}" "$@" || test "$?" = 5
          ' pytest
        args: [-q, --tb=short, -m, "slow and not cluster and not cuda and not integration and not performance"]

      - id: pytest-ci-smoke
        name: pytest (ci_smoke)
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Slower package/CLI smoke tests, deselected by the default marker
        # filter. Tolerate pytest exit 5 (no tests collected): a package may
        # ship none, which is not a failure.
        entry: >-
          bash -c '
            workers=$(nproc);
            workers=$((workers / 2));
            ((workers < 2)) && workers=2;
            ((workers > 32)) && workers=32;
            cov=();
            uv --quiet run --frozen --group test \
              python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group test \
            pytest -n="$workers" "${cov[@]}" "$@" || test "$?" = 5
          ' pytest
        args: [-q, --tb=short, --durations=20, -m, ci_smoke]

      - id: pytest-integration
        name: pytest (integration)
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # Opt-in: the `integration` marker means "needs networking or a real
        # database" in every package that defines it, and no hosted runner has
        # either -- trackinizer's failed on `extension "vector" is not
        # available`. The monorepo gates this in its root conftest; exported
        # packages ship no conftest, so the gate lives here. Set
        # RUN_INTEGRATION=1 in a job that has provisioned the services.
        #
        # Tolerate pytest exit 5 (no tests collected): this package may ship no
        # integration-marked tests, which is not a failure. Regular pytest above
        # stays strict so an empty collection there still fails.
        entry: >-
          bash -c '
            [ -n "${RUN_INTEGRATION:-}" ] || exit 0;
            workers=$(nproc);
            workers=$((workers / 2));
            ((workers < 2)) && workers=2;
            ((workers > 32)) && workers=32;
            cov=();
            uv --quiet run --frozen --group test \
              python -c "import pytest_cov" 2>/dev/null && cov=(--no-cov);
            uv --quiet run --frozen --group test \
            pytest -n="$workers" "${cov[@]}" "$@" || test "$?" = 5
          ' pytest
        args: [-q, --tb=short, -m, integration]
