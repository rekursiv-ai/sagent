            --collect-only -m ci_smoke "${sel[@]}";
            status="$?"; test "$status" = 0 || test "$status" = 5; exit "$?";
            fi;
            env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" "${select[@]}" -q --tb=short --durations=20
