      - id: pytest-integration-global
        name: pytest-integration-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # See `progress output` at the head of the Pre-Push Gates section.
        verbose: true
        # Gated on the CAPABILITY, not an env var: these need a real Postgres,
        # so skip when `pg_config` is absent and RUN when it is there. A
        # RUN_INTEGRATION=1 opt-in left the pgvector this image installs
        # provisioned and never exercised.
        #
        # `pg_config` present but pgvector missing still fails loudly ("extension
        # \"vector\" is not available") -- a broken provision, not a machine
        # without a database, and must not be silently skipped.
        #
        # Exit 5 tolerated: see pytest-slow-global above.
        #
        # $PYTEST_SPLIT_ARGS: see pytest-slow-global above -- this tier was
        # unsharded in practice for the same reason.
        entry: *worker-entry
        args:
          - WORKERS_PYTEST_INTEGRATION_GLOBAL
          - >-
            command -v pg_config >/dev/null 2>&1 || exit 0;
            nodeids=();
            if [ -n "${PYTEST_NODEIDS_FILE:-}" ]; then
            while IFS= read -r nodeid; do case "$nodeid" in *::*) nodeids+=("$nodeid") ;; esac; done < "$PYTEST_NODEIDS_FILE";
            [ ${#nodeids[@]} -eq 0 ] && exit 0;
            fi;
            select=(); cov=(); sel=();
            has() { uv --quiet run --frozen --group pre-commit python -c "$1" 2>/dev/null; };
            has "import ops.github.selected_nodeids_plugin" &&
            sel=(-p ops.github.selected_nodeids_plugin);
            if [ -z "${PYTEST_FORCE_ALL:-}" ] && [ -z "$PYTEST_SPLIT_ARGS" ] && { [ -n "${PYTEST_COLLECT_SELECTED:-}" ] || [ -z "${GITHUB_ACTIONS:-}" ]; } && has "import testmon"; then
            select=(--testmon-forceselect);
            else has "import pytest_cov" && cov=(--no-cov);
            fi;
            if [ -n "${PYTEST_COLLECT_SELECTED:-}" ]; then
            env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${select[@]}" -q --tb=short --dist=loadgroup
            --collect-only -m integration "${sel[@]}";
            status="$?"; test "$status" = 0 || test "$status" = 5; exit "$?";
            fi;
            env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" "${select[@]}" -q --tb=short --dist=loadgroup
            $PYTEST_PROGRESS_ARGS -m integration
            $PYTEST_SPLIT_ARGS "${nodeids[@]}"
            || test "$?" = 5
