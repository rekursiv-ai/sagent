# Universal Style and Quality Enforcement
# Pre-commit/pre-push checks _and_ source-of-truth for Github workflows.
#
# Usage:
#   The `pre-commit` dependency group supplies every tool the hooks below
#   invoke. Naming it explicitly is belt-and-braces, NOT a requirement: uv
#   defaults `default-groups` to `["dev"]`, and pyproject's `dev` includes
#   `pre-commit`, so a bare `uv run` already resolves the tools (verified on a
#   scratch project). Name it anyway so the command does not depend on that
#   chain staying intact.
#
#     uv --quiet run --frozen --group pre-commit pre-commit install
#     uv --quiet run --frozen --group pre-commit pre-commit autoupdate
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#
#   May need: git config --unset-all core.hooksPath
#     if: [ERROR] Cowardly refusing to install hooks with `core.hooksPath` set.
#
#   Stages. `default_stages: [pre-commit]` below means a bare `run` sees only
#   the pre-commit hooks; the heavy ones (ty-check-global, basedpyright-global,
#   pytest*) declare `stages: [pre-push]` and need it named explicitly:
#
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files --hook-stage pre-push
#     uv --quiet run --frozen --group pre-commit pre-commit run --all-files --hook-stage commit-msg
#
#   Always pass --files or --all-files. Bare `run` (and the hook `git commit`
#   fires on a dirty tree) STASHES your changes -- a git mutation, and this
#   worktree is shared.
#
#   # Harvest all changed files from the perspective of CWD.
#     uv --quiet run --frozen --group pre-commit pre-commit run --files $(git --no-pager diff --name-only --diff-filter=d HEAD | sed "s|^|$(git rev-parse --show-cdup)|")
#
#   # Run only the files from the CWD.
#     uv --quiet run --frozen --group pre-commit pre-commit run --files $(git --no-pager diff --name-only --cached --relative | xargs)
#
#   One hook at a time, by id (`ruff-check`, `ty-check`, `pytest-global`, ...):
#     uv --quiet run --frozen --group pre-commit pre-commit run ruff-check --all-files
#     uv --quiet run --frozen --group pre-commit pre-commit run pytest-global --hook-stage pre-push
#
#   Force full pytest tiers despite testmon's warm dependency database:
#     PYTEST_FORCE_ALL=1 uv --quiet run --frozen --group pre-commit pre-commit run pytest-global --hook-stage pre-push
#
#   Individual tests: the pytest hooks take no test selector, so call pytest
#   directly.
#
#     uv --quiet run --frozen --group pre-commit pytest path/to/thing_test.py
#     uv --quiet run --frozen --group pre-commit pytest path/to/thing_test.py::test_name
#     uv --quiet run --frozen --group pre-commit pytest -k some_substring path/to/
#     uv --quiet run --frozen --group pre-commit pytest -n 5 path/to/
#
#   Marker tiers mirror the pytest-slow-global / -ci-smoke-global /
#   -integration-global hooks; the
#   default `-m` filter lives in pyproject addopts, so ask for them by name:
#
#     uv --quiet run --frozen --group pre-commit pytest -m slow path/to/
#
#   Skipping. SKIP takes hook ids, comma-separated, and reports "Skipped":
#
#     SKIP=ruff-check uv --quiet run --frozen --group pre-commit pre-commit run --all-files
#     SKIP=pytest-global,pytest-slow-global uv --quiet run --frozen --group pre-commit pre-commit run --hook-stage pre-push --all-files
#
#   `git commit --no-verify` / `git push --no-verify` bypass every hook. Both
#   are a last resort, not a way past a red gate -- the gates are house rules
#   (see AGENTS.md "Never suppress gates"). Fix the code the hook protects.
#   The legitimate use is an unrelated pre-existing failure blocking an
#   urgent unrelated commit; say so in the commit message when you do it.
#
#
# On Source of Truthness:
#
#   Preferred location for any tool setting, in order:
#     pyproject.toml  >  .pre-commit-config.yaml  >  .github/workflows/ci.yml
#
#   Put a setting as high in this chain as the tool allows. Only drop to a
#   lower file when the higher one cannot express it (e.g. a CLI-only flag with
#   no config key). pyproject.toml holds tool config; .pre-commit-config.yaml
#   is the sole source for how hooks run (thread/worker counts, heap caps);
#   .github/workflows/ci.yml only invokes the hooks and must not redefine
#   any of these.
#
#
# Design Philosophy;
#
#   Only fail if there's things which cannot be auto-fixed.
#   Hooks fix files in place; if anything changes, pre-commit reports
#   "files were modified" and the commit is aborted. Run `git add -u`
#   then re-commit -- the second attempt always passes.
#
# See also:
#
#   https://pre-commit.com
#   https://pre-commit.com/hooks.html
#   https://learn.scientific-python.org/development/guides/style/

fail_fast: false
default_stages: [pre-commit]

repos:

  # === Pre-Commit Gates =======================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      - id: end-of-file-fixer
        name: end-of-file-fixer
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: trailing-whitespace
        name: trailing-whitespace
        stages: [pre-commit]
        exclude: |
          (?x)^(
            (.*/)?third_party/
          )

      - id: check-added-large-files
        name: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=750, --enforce-all]
        exclude: |
          (?x)^(
            uv\.lock
            |typings/
            |(.*/)?chrome/chrome_(desktop|android)_useragents\.txt
          )

      - id: check-merge-conflict
        name: check-merge-conflict
        stages: [pre-commit]
        args: [--assume-in-merge]

      - id: check-yaml
        name: check-yaml
        stages: [pre-commit]

      - id: check-toml
        name: check-toml
        stages: [pre-commit]

  # Type-checks `${{ }}` expressions, action inputs, runner labels, and `run:`
  # shell. A workflow expression error fails the job in 0s with no log, so
  # nothing downstream catches it; `check-yaml` only proves the file parses.
  # Self-selects on `^\.github/workflows/`.
  #
  # `actionlint`, not `-docker`/`-system`: only the golang hook provisions
  # itself. `-docker` needs a daemon this host lacks, `-system` a hand-installed
  # binary -- both fail closed on a fresh checkout, which is how the tool went
  # uninstalled while the docs cited it.
  #
  # SC2016 only: the export workflows single-quote
  # `--validation-command 'wheel="$wheel" ...'` deliberately -- those `$` belong
  # to the inner shell, so "expressions don't expand" inverts the intent. Every
  # other shellcheck rule stays live, and shellcheck runs only where installed,
  # so this is stricter on CI than on a dev box.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-commit]
        args: [-ignore, "SC2016:"]

  # Validates uv.lock matches pyproject.toml (no network needed).
  # Run `uv lock` manually when changing dependencies.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:

      - id: uv-lock
        name: uv-lock
        stages: [pre-commit]
        files: ^(pyproject\.toml|uv\.lock)$

  - repo: local
    hooks:
      - id: codespell
        name: codespell
        language: system
        stages: [pre-commit]
        types_or: [python, markdown, jupyter, shell]
        entry: uv --quiet run --frozen --group pre-commit codespell
        args: [-w]
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
          )

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Exclusions defined in pyproject.toml.
      #
      # `require_serial: true` on both: ruff is rayon-parallel, so pre-commit's
      # argv partitioning stacks cpu_count saturating processes on top. Cheap
      # here (sub-second tree-wide), same defect `basedpyright` below documents.
      - id: ruff-check
        name: ruff-check
        stages: [pre-commit]
        require_serial: true
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        name: ruff-format
        stages: [pre-commit]
        require_serial: true
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      # Single definition of `&worker-entry` anchor.
      #
      # It sizes $WORKERS, then runs the hook's command line from the single
      # `args` entry; per-hook differences (env vars, marker filters, exit-5
      # tolerance, capability guards) live in that arg, so the arithmetic exists
      # once. Inline rather than under ops/ because this file is copied verbatim
      # into public repos that get no ops/.
      #
      # Appended filenames reach the inner command as "$@" after an explicit
      # `bash` $0: plain `bash -c "$@"` would eat the first FILENAME as $0 and
      # drop it from the check.
      #
      #   WORKERS = max(2, min(perf - 1, round(phys * 3/8)))
      #
      # `phys` counts physical cores (SMT deduped), `perf` those at the top
      # clock. Both terms were FITTED to measured optima, not derived:
      #
      #   host                     nproc  phys  perf  optimal  imputed
      #   tron (Core Ultra 7 255H)    16    16     6        5        5
      #   colossus (EPYC 9555)       128    64    64       24       24
      #
      # `optimal` is the measured best `pytest -n`. tron: 5 -> 216s vs 6 -> 256s
      # (653 slow tests, idle box); its 16 cores span three clock domains
      # (6x5.1GHz, 8x4.4GHz, 2x2.5GHz), only the first counting as perf.
      # colossus: 24 -> 105s vs 20 -> 113s (651 slow tests); uniform 3.25GHz, so
      # perf == phys and `perf - 1` never binds. The floor of 2 binds only on a
      # 2-vCPU runner, where xdist still beats serial (5.4s vs 6.4s).
      #
      # Do NOT "simplify" this to a core count: physical cores, top frequency
      # domain, and nproc/2 each overshot a box. The EPYC curve is a sawtooth
      # (24, 32 fast; 20, 28 slow -- likely CCD alignment), so a nearby value is
      # not interchangeable.
      #
      # Overriding, most specific first: each hook honors the variable named as
      # its FIRST arg (`WORKERS_PYTEST_INTEGRATION_GLOBAL=1`), then
      # `WORKERS_DEFAULT`, then this formula. Per-hook is what CI needs -- the
      # integration tier holds ~1.8 GB of torch/jax per worker and OOM-killed a
      # 2-vCPU runner at two workers, while basedpyright on the same box wants
      # more. A bare `WORKERS=` is deliberately NOT read: the wrapper exports
      # `WORKERS`, so reusing that name as the input would leak one hook's
      # resolved count into every later hook in the same shell.
      - id: worker-sizing
        name: worker-sizing (anchor only; never runs)
        language: fail
        stages: [manual]
        files: $^
        # $1 is the name of the variable this hook's count may be OVERRIDDEN by;
        # `$WORKERS` is the resolved value every `args` command reads. Two names
        # because the override is optional -- a command reading
        # `$WORKERS_PYTEST_GLOBAL` directly would emit `-n=` on the usual run
        # where nobody set it, and never reach the formula below.
        entry: &worker-entry >-
          bash -c '
            eval "WORKERS=\${$1:-\${WORKERS_DEFAULT:-}}"; shift;
            if [ -z "$WORKERS" ]; then
              cpu=/sys/devices/system/cpu;
              if [ -d "$cpu/cpu0/topology" ]; then
                phys=$(cat $cpu/cpu*/topology/core_id 2>/dev/null | sort -u | wc -l);
                top=$(sort -rn $cpu/cpu*/cpufreq/cpuinfo_max_freq 2>/dev/null | head -1);
                perf=$([ -n "$top" ] && grep -lx "$top" $cpu/cpu*/cpufreq/cpuinfo_max_freq | xargs -n1 dirname | xargs -n1 dirname | xargs -I@ cat @/topology/core_id | sort -u | wc -l || echo "$phys");
              else
                phys=$(sysctl -n hw.physicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN);
                perf=0;
                for i in $(seq 0 $(( $(sysctl -n hw.nperflevels 2>/dev/null || echo 1) - 1 ))); do
                  [ "$(sysctl -n hw.perflevel$i.name 2>/dev/null)" = Efficiency ] && continue;
                  perf=$(( perf + $(sysctl -n hw.perflevel$i.physicalcpu 2>/dev/null || echo 0) ));
                done;
                ((perf < 1)) && perf=$phys;
              fi;
              WORKERS=$(( (phys * 3 + 4) / 8 ));
              ((WORKERS > perf - 1)) && WORKERS=$(( perf - 1 ));
              ((WORKERS < 2)) && WORKERS=2;
              # max(2, min(perf - 1, round(phys * 3/8))); +4 rounds to nearest.
            fi;
            export WORKERS;
            exec bash -c "$1" bash "${@:2}"
          ' bash

      # No official ty hook yet (https://github.com/astral-sh/ty/issues/269).
      # `require_serial: true` for the same reason as `basedpyright` below: ty
      # is rayon-parallel and saturates every core alone (17 threads measured
      # for one invocation on a 16-core box); concurrent, pre-commit multiplies
      # that by cpu_count.
      - id: ty-check
        name: ty-check
        language: system
        stages: [pre-commit]
        require_serial: true
        # See `superseded-at-pre-push` at the head of the Pre-Push Gates section.
        alias: superseded-at-pre-push
        # Passing filenames makes ty ignore `[tool.ty.src].exclude`; not passing
        # them makes every commit repo-wide. Hence the duplication: the exclude
        # below must mirror pyproject.toml's `[tool.ty.src]`.
        types_or: [python, pyi]
        entry: uv --quiet run --frozen --group pre-commit ty check
        args:
          - --output-format
          - concise
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
            |(.*/)?docs/
          )

      # `basedpyright-global` at pre-push is the real gate.
      # Do not weaken that one on the strength of this passing.
      #
      # The exclude mirrors pyproject's `[tool.basedpyright] exclude` for the
      # reason `ty-check` above documents. Monorepo-only paths carry
      #
      # `require_serial: true` because this hook parallelizes itself. Without
      # it pre-commit forks ~cpu_count partitions CONCURRENTLY, each its own
      # basedpyright at `--threads=$WORKERS` -- a 500-file changeset launched 18
      # processes and ~96 Node workers on a 16-core box. Serial partitioning is
      # what makes $WORKERS a cap.
      - id: basedpyright
        name: basedpyright
        language: system
        stages: [pre-commit]
        require_serial: true
        # See `superseded-at-pre-push` at the head of the Pre-Push Gates section.
        alias: superseded-at-pre-push
        types_or: [python, pyi]
        entry: *worker-entry
        args:
          - WORKERS_BASEDPYRIGHT
          - >-
            exec env NODE_OPTIONS=--max-old-space-size=2048
            uv --quiet run --frozen --group pre-commit
            basedpyright --threads="$WORKERS" "$@"
        exclude: |
          (?x)^(
            typings/
            |(.*/)?third_party/
          )

      # Runs the test file PAIRED with each changed source file, nothing
      # transitive: ~1s, versus the whole suite at pre-push.
      #
      # Deliberately not an affected-set analysis. The reverse-import closure of
      # a 42-file changeset here is 2482 files / 1124 test files (39% of the
      # tree) because one touched module has 212 importers -- import
      # reachability is not behavioral dependence, so the cheap pairing buys
      # nearly as much and pre-push runs everything regardless.
      #
      # Probes both sidecar spellings and a mirrored tests/ tree; a layout
      # matching none runs nothing and exits 0. Green here means "no paired test
      # found", not "tested" -- acceptable only because pre-push is the gate.
      #
      # Tolerate exit 5 (nothing collected): a sidecar whose every test carries
      # a deselected marker collects zero, which is not a failure -- editing
      # `chrome/echo.py` reported RED on seven passing integration tests. A real
      # failure is exit 1 and still fails.
      #
      # `-n` is chosen from changeset size because neither setting wins
      # everywhere: xdist costs a fixed ~5s startup, a sidecar is ~0.23s serial
      # vs ~0.10s spread, so the curves cross. Measured on tron (WORKERS=5),
      # files -> wall:
      #
      #   files    8    12    16    20    60
      #   serial  5.7s  7.6s  6.8s  12.4s 27.8s
      #   -n5     8.1s  9.0s  7.5s   8.0s 16.3s
      #
      # The threshold sits at the crossover, one below the first size where -n
      # won, so a few-file commit -- what this tier exists for -- never pays
      # startup and a sweeping refactor still gets workers. SIDECAR_XDIST_MIN
      # overrides.
      #
      # `read -d ''`, not `mapfile`: mapfile is bash 4.0 and macOS ships 3.2.
      # `printf '\0'` supplies the NUL, so read exits 0 instead of on EOF.
      #
      # `require_serial: true` is a separate axis, governing pre-commit's OWN
      # argv partitioning: it forks cpu_count copies of this whole hook, which
      # multiplies the startup cost the threshold avoids and stacks on any `-n`.
      # 60 files as 16 forked hooks burned 73s of CPU for the same 16.3s wall
      # one hook at -n5 reaches on 36s.
      - id: pytest
        name: pytest
        language: system
        stages: [pre-commit]
        require_serial: true
        # See `superseded-at-pre-push` at the head of the Pre-Push Gates section.
        alias: superseded-at-pre-push
        types: [python]
        entry: *worker-entry
        args:
          - WORKERS_PYTEST
          - >-
            tests=();
            for f in "$@"; do
              dir=$(dirname "$f");
              stem=$(basename "$f" .py); stem=${stem%_test}; stem=${stem#test_};
              for cand in "$dir/${stem}_test.py" "$dir/test_${stem}.py" \
                          "tests/${dir#src/}/${stem}_test.py" \
                          "tests/${dir#src/}/test_${stem}.py"; do
                [ -f "$cand" ] && tests+=("$cand");
              done;
            done;
            [ ${#tests[@]} -eq 0 ] && exit 0;
            IFS=$'\n' read -r -d '' -a tests < <(printf "%s\n" "${tests[@]}" | sort -u && printf '\0');
            dist=();
            ((${#tests[@]} >= ${SIDECAR_XDIST_MIN:-16})) && dist=(-n "$WORKERS");
            uv --quiet run --frozen --group pre-commit pytest "${dist[@]}" -q --tb=short "${tests[@]}"
            || test "$?" = 5

  # === Pre-Push Gates =========================================================
  #
  # To enable:  uv run pre-commit install --hook-type pre-push
  # To disable: uv run pre-commit uninstall --hook-type pre-push
  #
  # `ty-check`, `basedpyright` and `pytest` above each answer a strictly weaker
  # question than a hook here, so all three carry
  # `alias: superseded-at-pre-push` -- a plain `SKIP=` selector letting a lane
  # that runs the pre-push tier drop them in one token, with no hook ids to
  # drift. pre-commit skips every hook sharing an alias.
  #
  # Not cosmetic: the per-file `basedpyright` turned repo-wide when CI's
  # periodic lane ran the commit stage `--all-files` (passing filenames also
  # voids pyproject's excludes), and on a 2-vCPU runner it blew the 30-minute
  # job cap while `basedpyright-global` answered the same question in 12.
  #
  # Every `*worker-entry` below resolves the anchor DEFINED on the pre-commit
  # `basedpyright` hook, so reordering that hook past these is a YAML error, not
  # a silent regression. `precommit_regex_test.py` asserts all six stay
  # byte-identical, so pasting the wrapper in place of a reference fails.
  #
  # progress output. Every pytest tier here runs for minutes and used to emit a
  # single verdict line, which is also why the OOM that killed one looked like a
  # hang. TWO layers suppress the transcript and both are undone below; fixing
  # either alone still leaves a silent hook.
  #
  #   `verbose: true` -- pre-commit captures a hook's stdout and stderr into one
  #   buffer and prints it only `if verbose or hook.verbose or retcode or
  #   files_modified`, so a PASSING hook's output is discarded. Set per hook
  #   rather than relying on a `--verbose` the caller may not pass.
  #
  #   `env PYTHONUNBUFFERED=1` -- that buffer is a PIPE, not a tty, so libc
  #   block-buffers pytest's writes. Measured on the ci_smoke tier: piped
  #   default and piped `-v` both held 0 bytes for 24s and flushed everything at
  #   exit, while PYTHONUNBUFFERED had 709 bytes out by t=8s. Without it the
  #   progress exists only once the process ends, which is exactly when an OOM
  #   kill has already discarded it.
  #
  # Deliberately NOT `-v`: it changes what pytest writes (one line per test),
  # not when, and measured no earlier than the default. The per-file `pytest`
  # hook is excluded from both -- it finishes in ~1s, and a pytest transcript on
  # every commit would bury the hooks that failed.

  - repo: local
    hooks:
      - id: ty-check-global
        name: ty-check-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: uv --quiet run --frozen --group pre-commit ty check
        # Exclusions defined in pyproject.toml.

      - id: basedpyright-global
        name: basedpyright-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: *worker-entry
        args:
          - WORKERS_BASEDPYRIGHT_GLOBAL
          - >-
            exec env NODE_OPTIONS=--max-old-space-size=2048
            uv --quiet run --frozen --group pre-commit
            basedpyright --threads="$WORKERS"

      - id: pytest-global
        name: pytest-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # See `progress output` at the head of the Pre-Push Gates section.
        verbose: true
        # Deliberately no testmon when this hook is sharded. It deselects in
        # `pytest_ignore_collect`, a COLLECTION hook, while pytest-split partitions in
        # `pytest_collection_modifyitems` -- and testmon ALSO registers that
        # hook, `trylast=True`, exactly as pytest-split does. Which one wins is
        # plugin registration order, not anything either declares. Measured when
        # they last ran together: one shard with a warm database ran 8 tests
        # where the cold run ran 118, and the four shards' union covered 76 of
        # 257 rather than all of them. Tests went unrun and the gate stayed
        # green.
        #
        # So the two are mutually exclusive, and the choice is DERIVED rather
        # than configured twice: `$PYTEST_SPLIT_ARGS` non-empty means this run is
        # one shard of several, so it must run every test it was handed and
        # selection is off; empty means one process owns the whole tier and
        # testmon selects. The workflow sets that variable per matrix job (from
        # `matrix_entries` in ops/github/precommit_matrix.py) and nothing sets it
        # locally, so a local pre-push selects and a sharded CI job does not,
        # with no second switch to keep in step. ops/github/testmon_gate_test.py
        # runs this shell both ways to prove it.
        #
        # Unquoted on purpose: it must word-split into flags.
        #
        # It must be `--testmon-forceselect`, NOT plain `--testmon`: pyproject's
        # addopts carries a default `-m 'not ci_smoke and ...'`, and testmon
        # self-deactivates whenever `-m` is present, collecting a database and
        # selecting nothing -- indistinguishable from working
        # (tarpas/pytest-testmon#238). On a cache miss it runs everything, so it
        # is fail-safe.
        #
        # COVERAGE_CORE=ctrace: coverage defaults to core=sysmon on 3.14, which
        # cannot carry the dynamic contexts testmon switches per test. It warns,
        # and pyproject's `filterwarnings = ["error"]` turns that into an
        # INTERNALERROR collecting zero tests. Testmon builds Coverage with
        # config_file=False, so only the env var reaches it.
        #
        # --no-cov only when pytest-cov is installed AND testmon is not
        # selecting: the flag is an error without the plugin ("unrecognized
        # arguments: --no-cov"), and testmon needs coverage to see which tests
        # touched changed code. This file is copied into every exported package,
        # not all of which carry either plugin.
        #
        # The selection file is written by `selected_nodeids_plugin`, which
        # emits node ids and nothing else, so an empty selection is a byte-empty
        # file and the `-eq 0` guard below sees it. The reader still keeps only
        # lines containing `::`: the plugin is probed for, not assumed, and an
        # exported package that answers no falls back to a plain collection
        # whose stdout a caller might still redirect here. One non-node-id
        # argument makes pytest collect ZERO tests -- not the rest minus one --
        # so the filter is cheap insurance against reintroducing that.
        entry: *worker-entry
        args:
          - WORKERS_PYTEST_GLOBAL
          - >-
            CI_TESTMON=1;
            nodeids=();
            if [ -n "${PYTEST_NODEIDS_FILE:-}" ]; then
            while IFS= read -r nodeid; do case "$nodeid" in *::*) nodeids+=("$nodeid") ;; esac; done < "$PYTEST_NODEIDS_FILE";
            [ ${#nodeids[@]} -eq 0 ] && exit 0;
            fi;
            select=(); cov=(); sel=();
            has() { uv --quiet run --frozen --group pre-commit python -c "$1" 2>/dev/null; };
            has "import ops.github.selected_nodeids_plugin" &&
            sel=(-p ops.github.selected_nodeids_plugin);
            if [ -z "${PYTEST_FORCE_ALL:-}" ] && [ -z "$PYTEST_SPLIT_ARGS" ] && has "import testmon"; then
            select=(--testmon-forceselect);
            else has "import pytest_cov" && cov=(--no-cov);
            fi;
            if [ -n "${PYTEST_COLLECT_SELECTED:-}" ]; then
            env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${select[@]}" "${sel[@]}" -q --tb=short
            --collect-only;
            status="$?"; test "$status" = 0 || test "$status" = 5; exit "$?";
            fi;
            exec env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" "${select[@]}" -q --tb=short
            $PYTEST_PROGRESS_ARGS $PYTEST_SPLIT_ARGS "${nodeids[@]}"

      - id: pytest-slow-global
        name: pytest-slow-global
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        # See `progress output` at the head of the Pre-Push Gates section.
        verbose: true
        # --no-cov only when pytest-cov is installed: the flag errors without
        # the plugin, and no pre-push tier needs coverage.
        #
        # Tolerate exit 5 (nothing collected): a tree may ship no tests for this
        # marker. Not fail-open -- `pytest-global` above still fails on an empty
        # collection, and ops/github/marker_tiers_test.py fails any tier that
        # goes empty without being declared empty.
        #
        # $PYTEST_SPLIT_ARGS is what makes this tier's four CI jobs distinct.
        # Omitting it was silent for four runs: the workflow set the variable,
        # this hook ignored it, and all four "shards" ran the identical 725
        # tests at ~23 minutes each -- no split, no memory bound, 4x the billed
        # time. Unquoted on purpose: it must word-split into flags, and it is
        # empty for every local run.
        entry: *worker-entry
        args:
          - WORKERS_PYTEST_SLOW_GLOBAL
          - >-
            nodeids=();
            if [ -n "${PYTEST_NODEIDS_FILE:-}" ]; then
            while IFS= read -r nodeid; do case "$nodeid" in *::*) nodeids+=("$nodeid") ;; esac; done < "$PYTEST_NODEIDS_FILE";
            [ ${#nodeids[@]} -eq 0 ] && exit 0;
            fi;
            select=(); cov=(); sel=();
            has() { uv --quiet run --frozen --group pre-commit python -c "$1" 2>/dev/null; };
            has "import ops.github.selected_nodeids_plugin" &&
            sel=(-p ops.github.selected_nodeids_plugin);
            if [ -z "${PYTEST_FORCE_ALL:-}" ] && [ -z "$PYTEST_SPLIT_ARGS" ] && { [ -n "${PYTEST_COLLECT_SELECTED:-}" ] || [ -z "${GITHUB_ACTIONS:-}" ]; } && has "import testmon"; then
            select=(--testmon-forceselect);
            else has "import pytest_cov" && cov=(--no-cov);
            fi;
            if [ -n "${PYTEST_COLLECT_SELECTED:-}" ]; then
            env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${select[@]}" -q --tb=short --collect-only
            -m "slow and not cluster and not cuda and not integration and not performance"
            "${sel[@]}";
            status="$?"; test "$status" = 0 || test "$status" = 5; exit "$?";
            fi;
            env PYTHONUNBUFFERED=1 COVERAGE_CORE=ctrace
            uv --quiet run --frozen --group pre-commit
            pytest -n="$WORKERS" "${cov[@]}" "${select[@]}" -q --tb=short
            $PYTEST_PROGRESS_ARGS
            -m "slow and not cluster and not cuda and not integration and not performance"
            $PYTEST_SPLIT_ARGS "${nodeids[@]}"
            || test "$?" = 5

