[project]
name = "blackjax-ai-devs-channel"
version = "0.0.1"
description = "Per-role sagent Agent factories for the BlackJAX dev team."
requires-python = ">=3.12"
dependencies = [
    "sagent",
]

[tool.uv.sources]
# In-repo example: depend on the sagent checkout two levels up.
sagent = { path = "../../", editable = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["roles*", "tests*"]
