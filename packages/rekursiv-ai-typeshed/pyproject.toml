[project]
name = "rekursiv-ai-typeshed"
version = "0.1.0"
description = "typeshed for basedpyright and ty with int/float ** returning float, not Any."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "rekursiv.ai"},
]
dependencies = ["basedpyright>=1.40.1", "ty>=0.0.82"]

[build-system]
requires = ["hatchling>=1.32.1", "basedpyright>=1.40.1", "ty>=0.0.82"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rekursiv_ai_typeshed"]
exclude = ["rekursiv_ai_typeshed/hatch_build.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "rekursiv_ai_typeshed/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["rekursiv_ai_typeshed", "README.md"]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "../../uv.lock"},
    {file = "README.md"},
    {file = "rekursiv_ai_typeshed/*.py"},
    {file = "rekursiv_ai_typeshed/py.typed"},
    {file = "rekursiv_ai_typeshed/typeshed.patch"},
    {file = "rekursiv_ai_typeshed/typings/**/*.pyi"},
]

[tool.uv.extra-build-dependencies]
rekursiv-ai-typeshed = [
    {requirement = "basedpyright", match-runtime = true},
    {requirement = "ty", match-runtime = true},
]
