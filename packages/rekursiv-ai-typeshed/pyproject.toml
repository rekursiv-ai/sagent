[project]
name = "rekursiv-ai-typeshed"
version = "0.1.0"
description = "typeshed for basedpyright and ty with int/float ** returning float, not Any."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "rekursiv.ai"},
]
# Exact pins: the wheel is BUILT from these two bundles, so a project that
# depends on this package gets the checkers its stub tree was cut from.
dependencies = [
    "basedpyright==1.40.1",
    "ty==0.0.80",
]

[build-system]
requires = ["hatchling", "basedpyright==1.40.1", "ty==0.0.80"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rekursiv_ai_typeshed"]
exclude = ["rekursiv_ai_typeshed/hatch_build.py"]
# ``py.typed`` ships so a consumer's basedpyright reads the installed module's
# annotations even with ``useLibraryCodeForTypes = false``.

[tool.hatch.build.targets.wheel.hooks.custom]
path = "rekursiv_ai_typeshed/hatch_build.py"

# The build hook registers the generated tree as ``shared-data``, so it lands
# under the interpreter prefix at ``share/rekursiv-ai-typeshed`` -- one static,
# Python-version-independent path that a project's ``typeshedPath`` /
# ``[tool.ty.environment] typeshed`` can name (``.venv/share/rekursiv-ai-typeshed``).

[tool.hatch.build.targets.sdist]
include = ["rekursiv_ai_typeshed", "README.md"]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "README.md"},
    {file = "rekursiv_ai_typeshed/*.py"},
    {file = "rekursiv_ai_typeshed/py.typed"},
    {file = "rekursiv_ai_typeshed/typeshed.patch"},
    {file = "rekursiv_ai_typeshed/typings/**/*.pyi"},
]
