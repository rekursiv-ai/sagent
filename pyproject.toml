[project]
name = "sagent"
version = "0.1.15"
description = "Python-first Coding Agent API and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "rekursiv.ai", email = "hello@rekursiv.ai"}]
keywords = ["agent", "LLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # media
    "imagesize>=1.4",
    "pillow",
    "pyturbojpeg>=1.8.2,<2",
    "webp>=0.4.0",
    # data
    "numpy>=2.1",
    # nlp
    "tiktoken>=0.12.0",
    # web tooling. Floor at 0.1.1: it is the first release shipping py.typed, so
    # sagent's type-check (basedpyright/ty) sees wesearch's types instead of
    # ~670 cascading Unknown warnings from an untyped 0.1.0.
    # [extract] pulls trafilatura + defusedxml, which wesearch.web uses for
    # article extraction and RSS/Atom parsing on sagent's behalf.
    # 0.1.8 exports `public_host`, which tools/web_fetch.py threads into
    # fetch_web as the SSRF host validator.
    # 0.1.9 exports `Content` and `Retry`, the RequestParams field groups
    # tools/linear.py and tools/slack.py construct.
    "wesearch[extract]>=0.1.9",
    # web client / scraping
    "httpx>=0.27",
    # web server / api
    "uvicorn>=0.30.0",
    # mcp
    "mcp>=2.0.0",
    "starlette>=0.40",
    # llm
    "anthropic>=0.72.0",
    "openai>=2.20",
    # config
    "pyyaml>=6.0",
    # text / docs
    "pypdfium2",
    # markdown
    "markdown-it-py",
    "prompt-toolkit",
    "pygments",
    "rich",
    # containers
    "cachetools",
    "wrapt",
    # misc
    "bashlex>=0.18",
]

[project.scripts]
sagent = "sagent.bin.cli:main"
sagent-slack = "sagent.bin.slack:main"

[project.optional-dependencies]
# The `sagent-slack` entrypoint (bin/slack.py) is the only slack_sdk consumer
# and is not reached by `import sagent` or the main CLI, so its deps are opt-in.
# aiohttp is required transitively by slack_sdk.socket_mode.aiohttp. Install via
# `pip install sagent[slack]`; the bin/slack.py shebang passes `--extra slack`.
slack = [
    "slack-sdk>=3.33.0",
    "aiohttp>=3.13.5",
]
selfhosted = [
    "accelerate>=1.13.0",
    "auto-round>=0.12.3",
    "compressed-tensors",
    "kernels>=0.13.0",
    "nvidia-cudnn-cu13 ; sys_platform == 'linux'",
    "nvidia_cudnn_frontend ; sys_platform == 'linux'",
    "protobuf",
    "safetensors",
    "sentencepiece",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers>=5.8.0",
]

[dependency-groups]
# uv sync --all-groups

debug = [
    "ipykernel",
    "ipython",
]
lint = [
    "codespell>=2.2.4",
    "pre-commit>=4.6",
    "ruff",
]
test = [
    "hypothesis>=6.155.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "pytest-testmon>=2.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest>=7.0",
]
typecheck = [
    "basedpyright>=1.10",
    "ty>=0.0.60",
]
"pre-commit" = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typecheck"},
]
dev = [
    {include-group = "debug"},
    {include-group = "pre-commit"},
]

[project.urls]
Homepage = "https://www.rekursiv.ai"
Repository = "https://github.com/rekursiv-ai/sagent"
Documentation = "https://github.com/rekursiv-ai/sagent/tree/main/docs"
Source = "https://github.com/rekursiv-ai/sagent"
Issues = "https://github.com/rekursiv-ai/sagent/issues"
Changelog = "https://github.com/rekursiv-ai/sagent/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sagent"]
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.hatch.build.targets.sdist]
exclude = [".github/**", ".codespell-ignore"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["*_test.py", "test_*.py"]
markers = [
    "ci_smoke: slower package/CLI smoke tests run explicitly in CI",
    "cuda: tests that require a real CUDA device (skipped in hosted CI)",
    "integration: tests that require networking or external CLIs (deselected by default)",
    "performance: timing-sensitive tests (deselected by default)",
]
addopts = "-m 'not ci_smoke and not cuda and not integration and not performance' --durations=20 --dist=worksteal"
timeout = 60
# "error" = treat all warnings as errors (same as -Werror).
# Using filterwarnings instead of addopts so we can add exceptions.
filterwarnings = [
    "error",
    "ignore:Can.t initialize NVML:UserWarning",  # Optional torch runtimes may lack GPU drivers.
    "ignore:CUDA initialization. Unexpected error from cudaGetDeviceCount:UserWarning",  # GPU present but unusable (e.g. under -n parallel workers); CPU-only tests probe CUDA during backward and torch warns benignly.
    "ignore:Your system is avx2 capable but pygame was not built with support for it:RuntimeWarning",  # pufferlib -> pygame import-time note: the PyPI wheel is baseline-compiled (no AVX2 wheel exists; PYGAME_DETECT_AVX2 is compile-time only). Real fix = build pygame from sdist with AVX2, but rl_ocean is headless (never blits) so it is pure noise here.
    "ignore::pytest.PytestUnraisableExceptionWarning",  # async subprocess cleanup after event loop closes
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
norecursedirs = [
    "*.egg-info",
    ".agents",
    ".claude",
    ".hypothesis",
    ".venv",
    "__pycache__",
    "third_party",
    "typings",
]

[tool.coverage.run]
omit = [
    "*_test.py",
    "test_*.py",
    "*/tests/*",
    "*/.venv/*",
    "*/typings/*",
    "*/tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
show-fixes = true
line-length = 88
output-format = "concise"
target-version = "py312"
# force-exclude makes ruff honor exclude lists even for files passed explicitly
# (as pre-commit does). Required so lint.exclude below can skip typings/ on
# explicit paths while ruff format still reformats them.
# force-exclude = true
# Global exclude applies to BOTH check and format. typings/ is intentionally
# absent here: stubs are formatted but not linted (see lint.exclude).
exclude = [
    ".venv/",
    "*.egg-info/",
    ".pytest_cache/",
    "build/",
    "dist/",
    # "typings/",
    # "**/typings/",
    "**/third_party/",
]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Module-level ignores.
    "ANN",     # Flake8 annotations. (We use pyright for type checking.)
    "C90",     # McCabe complexity. (One function slightly over threshold.)
    "COM812",  # Missing trailing comma. (select=ALL warning is unfixable.)
               # https://github.com/astral-sh/ruff/issues/9216
    "CPY001",  # Missing copyright notice. (License is in LICENSE, not per-file.)

    # Relax docstring rules.
    "D100",    # Undocumented public module.
    "D101",    # Undocumented public class.
    "D102",    # Undocumented public method.
    "D103",    # Undocumented public function.
    "D104",    # Undocumented public package.
    "D105",    # Undocumented magic method.
    "D106",    # Undocumented public nested class.
    "D107",    # Undocumented public init.
    "D203",    # Incorrect blank line before class. (Conflicts with D211.)
    "D205",    # Missing blank line after summary.
    "D213",    # Multi-line summary second line. (Conflicts with D212.)
    "D400",    # Missing trailing period.
    "D401",    # Non-imperative mood.
    "D415",    # Missing terminal punctuation.
    "RUF001",  # Ambiguous unicode character string. (Intentional math usage of `α, σ, γ, ×` etc.)
    "RUF002",  # Ambiguous unicode character docstring. (Intentional math usage of `α, σ, η, ε, ≝, ½` etc.)
    "RUF003",  # Ambiguous unicode character comment. (Intentional math usage of `α, σ, η, ε, ≝, ½` etc.)

    # Standard style relaxations.
    "A002",    # Builtin argument shadowing.
    "E501",    # Line too long. (Will be fixed by formatter.)
    "EM101",   # Raw string in exception.
    "EM102",   # F-string in exception.
    "ERA001",  # Commented-out code.
    "FBT001",  # Boolean type hint positional argument.
    "FBT002",  # Boolean default value positional argument.
    "FBT003",  # Boolean positional value in call.
    "FIX002",  # Line contains TODO. (Too verbose descriptions of TODOs.)
    "FLY002",  # Consider f-string instead of join. (Join is often clearer.)
    "N806",    # Non-lowercase variable in function.
    "PLR0911", # Too many return statements. (Early returns aid clarity.)
    "PLR0912", # Too many branches.
    "PLR0913", # Too many arguments.
    "PLR0915", # Too many statements.
    "PLR2044", # Empty comment. (Helps to break-up long lists.)
    "PLW0642", # Self or cls assignment. (Reassignment of name in finalize.)
    "RET504",  # Unnecessary assign.
    "TC001",   # Typing-only first-party import. (Will be fixed by formatter.)
    "TC003",   # Typing-only standard library import. (Will be fixed by formatter.)
    "TC006",   # Runtime cast value.
    "TD003",   # Missing TODO link.
    "TRY003",  # Raise vanilla args.
    "TRY300",  # Try consider else.
    "BLE001",  # Blind exception (heterogeneous provider/cleanup handlers).

    # Additional style relaxations.
    # "DJ",    # Django.
    # "EXE",   # Flake8 executable.
    # "TID",   # Flake8 tidy imports.
    "A001",    # Builtin variable shadowing.
    "DTZ006",  # Call datetime fromtimestamp.
    "EXE001",  # Shebang is present but file is not executable.
    "G004",    # Logging f-string.
    "PLR1704", # Redefined argument from local.
    "PLR2004", # Magic value comparison.
    "S101",    # Use of `assert` detected.
    "SIM108",  # If-else block instead of if-exp.
    # "B008",  # Function call in default argument.
    "FIX001",  # Line contains FIXME.
    # "ICN001",# Unconventional import alias.
    # "N801",  # Invalid class name.
    # "N802",  # Invalid function name.
    # "N803",  # Invalid argument name.
    # "N813",  # Camelcase imported as lowercase.
    # "N815",  # Mixed case variable in class scope.
    # "PGH004",# Blanket noqa.
    # "PT027", # Pytest unittest raises assertion.
    "TD001",   # Invalid TODO tag: `FIXME`
    "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`
    "TD004",   # Missing colon in TODO
    "TD005",   # Missing issue description after `TODO`
]
exclude = [
    "**/typings/**",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",    # Unused import.
]
"{*_test.py,**/tests/test*.py}" = [
    "INP001",  # Implicit namespace package. (Tests don't need __init__.py.)
    "PLR2004", # Magic value comparison.
    "S101",    # Use of `assert` detected.
    "S301",    # Pickle usage.
    "SLF001",  # Private member access.
]
# Vendored third-party stubs generated by `pyright --createstub`. NEVER-FIX set:
# every rule here either has no autofix at all (clearing it means risky manual
# edits across thousands of mirrored files) or its fix would rename an exported
# symbol / rebind an import -- breaking the stub's job of mirroring upstream.
# Rules whose fix is type-preserving or improves correctness are deliberately
# EXCLUDED (e.g. PYI036 __exit__ widening, RUF013 implicit-Optional); fix those
# at the source instead of suppressing.
#
# Refresh workflow after a `pyright --createstub` regen (verified to keep
# `ty check .` and `basedpyright .` clean).
#    loop/tools/ruff_check_extra_autofix.py --select PYI002,PYI036,PYI051 typings
#    uv --quiet run --frozen ruff check typings --fix --unsafe-fixes
#    uv --quiet run --frozen ruff format typings
"typings/**" = [
    # === MUST NOT FIX (also in lint.unfixable): autofix corrupts stub types. ===
    "PYI015",   #    41 -- assignment-default-in-stub -- strips dataclass_transform field-specifier; breaks synthesized __init__.
    "PYI018",   #    39 -- unused-private-type-var -- deletes TypeVars used only in Generic[]/Protocol[] subscripts.
    "UP046",    #    94 -- non-pep695-generic-class -- PEP 695 rewrite rebinds/drops TypeVar params.
    "UP047",    #   342 -- non-pep695-generic-function -- PEP 695 rewrite breaks ParamSpec binding.
    # === MUST VIOLATE: intrinsic to any faithful stub. ===
    # Placement rule (by NATURE, not frequency -- count is irrelevant):
    #   HERE when the rule is intrinsically unsatisfiable for a faithful stub --
    #   the violation IS a naming / re-export / type-surface / stub-encoding
    #   convention that mirrors upstream, so any fix would change the exported
    #   surface. A single occurrence (e.g. N811, E743) still belongs here.
    #   INLINE (`# noqa: CODE -- reason`) when the rule fires because a specific
    #   line copies an upstream RUNTIME/style pattern (os.path call, debugger
    #   import, lru_cache, hardcoded default, Union-vs-`|`) -- the justification
    #   is per-site, not a property of being a stub.
    "A004",     #    13 -- builtin-import-shadowing -- mirrors upstream import names; renaming rebinds.
    "E743",     #     1 -- ambiguous-function-name -- mirrors upstream naming; renaming breaks callers.
    "F403",     #  1950 -- undefined-local-with-import-star -- stub re-exports the whole namespace.
    "F405",     #   712 -- undefined-local-with-import-star-usage -- re-export artifact of star import.
    "F722",     #    14 -- forward-annotation-syntax-error -- intentional annotation strings.
    "F811",     #    98 -- redefined-while-unused -- `@overload` / conditional re-binding.
    "F821",     #  6651 -- undefined-name -- forward refs; "fixing" means inventing the missing symbol.
    "F822",     #  1085 -- undefined-export -- name in `__all__` defined across a partial stub.
    "N801",     #   607 -- invalid-class-name -- mirrors upstream naming; renaming breaks callers.
    "N802",     #  3224 -- invalid-function-name -- mirrors camelCase upstream ops; renaming breaks callers.
    "N803",     #  7265 -- invalid-argument-name -- mirrors upstream API (e.g. `X`, `Y`); renaming breaks the contract.
    "N807",     #    22 -- dunder-function-name -- mirrors upstream names.
    "N811",     #     1 -- constant-imported-as-non-constant -- mirrors upstream import alias.
    "N812",     #    56 -- lowercase-imported-as-non-lowercase -- mirrors upstream import alias.
    "N814",     #     1 -- camelcase-imported-as-constant -- mirrors upstream import alias.
    "N815",     #   338 -- mixed-case-variable-in-class-scope -- mirrors upstream attribute names.
    "N816",     #    38 -- mixed-case-variable-in-global-scope -- mirrors upstream names.
    "N817",     #     5 -- camelcase-imported-as-acronym -- mirrors upstream import alias.
    "N818",     #    84 -- error-suffix-on-exception-name -- mirrors upstream exception names.
    "PLC0105",  #     9 -- type-name-incorrect-variance -- TypeVar name (e.g. `A`, `R`) is part of the exported surface; renaming to `A_co` breaks callers.
    "PLE0604",  #    14 -- invalid-all-object -- upstream dynamic `__all__`; rewrite guesses.
    "PLE0605",  #   124 -- invalid-all-format -- upstream builds `__all__` dynamically; rewrite guesses.
    "PLW0211",  #    13 -- bad-staticmethod-argument -- renaming the arg changes the signature.
    "PYI001",   #   307 -- unprefixed-type-param -- TypeVar name is part of the exported surface.
    "PYI002",   #   209 -- complex-if-statement-in-stub -- after ruff_check_extra_autofix strips the dead/TYPE_CHECKING residue, only genuine runtime-predicate guards (is_x_available(), os.getenv) remain; no compile-time truth value, so no mechanical flatten is provably correct.
    "PYI024",   #     5 -- collections-named-tuple -- stub encodes upstream `namedtuple(...)` definition; rewriting to NamedTuple restructures the class.
    "PYI035",   #     1 -- unassigned-special-variable-in-stub -- mirrors upstream `__all__`.
    "PYI042",   #    56 -- snake-case-type-alias -- mirrors upstream alias name.
    "PYI048",   #   100 -- stub-body-multiple-statements -- collapsing could drop a real assignment.
    "PYI063",   #     8 -- pep484-style-positional-only-parameter -- stub encodes positional-only via `__`-prefixed names mirroring upstream; PEP 570 rewrite renames params.
    "SLF001",   #   348 -- private-member-access -- stub legitimately references upstream internals.
    "TID252",   # 10272 -- relative-imports -- mirrors package layout; rewriting breaks intra-stub refs.
    # === INTENTIONALLY VIOLATE: fixable in principle, kept by choice. ===
    # Deleting a "locally unused" private is unsafe: it may be re-exported and
    # consumed by another stub (e.g. `_size as _size`), and a stub must be correct
    # independent of its consumers. loop/tools/ruff_check_extra_autofix.py can fix
    # these with a `# noqa` escape hatch, but we leave them rather than risk it.
    "PYI046",   #     4 -- unused-private-protocol -- may be re-exported cross-stub.
    "PYI047",   #    45 -- unused-private-type-alias -- may be re-exported cross-stub.
    "PYI049",   #     2 -- unused-private-typed-dict -- may be re-exported cross-stub.
]
"*.ipynb" = [
    "ARG001",  # Unused function argument (callbacks).
    "BLE001",  # Blind exception (sandboxed exec).
    "E402",    # Module level import not at top of file.
    "F811",    # Redefinition across cells.
    "F821",    # Undefined name (e.g., `display` from IPython).
    "INP001",  # Implicit namespace package.
    "PLC0415", # Import not at top level.
    "RUF100",  # Preserve noqa for jupytext-synced .py files.
    "S102",    # Use of exec.
    "S301",    # Pickle usage.
    "T201",    # Print found.
]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true
default-section = "third-party"
detect-same-package = true
force-single-line = false
force-sort-within-sections = false
from-first = true
lines-between-types = 1
lines-after-imports = 2
extra-standard-library = ["typing", "typing_extensions", "ty_extensions"]
known-first-party = ["sagent"]
no-lines-before = ["future"]
order-by-type = true
relative-imports-order = "closest-to-furthest"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
failOnWarnings = true  # Warnings fail the check (basedpyright default; pinned explicitly).
# Don't infer types from .venv site-packages source; use bundled/local stubs
# only. Stops basedpyright analyzing ~48k env files: full-repo run 74s -> 14s.
# Tradeoff: stub-less libs report Unknown, so they need stubs in typings/
# (e.g. boto3, datasets).
useLibraryCodeForTypes = false
exclude = [
    "**/.venv/",
    "**/.venv-ci312/",
    "**/node_modules/",
    "*.egg-info/",
    "**/*.ipynb",
    ".pytest_cache/",
    "build/",
    "dist/",
    "typings/",
    "**/third_party/",
    "**/typings/",
]
ignore = [
    "**/.venv/",
    "**/.venv-ci312/",
    "*.egg-info/",
    ".pytest_cache/",
    "build/",
    "dist/",
    "typings/",
    "**/third_party/",
]
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportAny = false                          # `Any` propagation is pervasive in PyTorch.
reportExplicitAny = false                  # Explicit `Any` annotations are intentional.
reportImplicitStringConcatenation = false  # Conflicts with ruff ISC003.
reportInvalidCast = false                  # All cast() calls are intentional.
reportPrivateUsage = false                 # Redundant with ruff SLF001.
reportUnannotatedClassAttribute = false    # Class attributes don't always need annotations.
reportUnusedCallResult = false             # Discarding return values is idiomatic Python.
reportUnusedImport = false                 # Redundant with ruff F401.
# Extra suppressions.
reportCallInDefaultInitializer = false     # Immutable constructors (e.g. NamedTuple) in defaults are safe.
reportIncompatibleMethodOverride = false   # Subclasses may rename parameters.
reportMissingSuperCall = false             # Fires on plain `object` inheritance (no-op super).
reportImportCycles = false                 # Lazy imports inside functions create benign cycles.
reportUnsafeMultipleInheritance = false    # Mixin patterns are intentional.
# reportConstantRedefinition = false       # Uppercase locals treated as constants (math). [Violates PEP8]
# We deliberately don't use `--all-extras` for ty and basedpyright because
# pulling in the multi-GB torch/transformers stack into every export CI just to
# type-check an opt-in backend isn't worth it.
reportMissingModuleSource = false
# Export-only: source `# pyright: ignore[reportUnknownMemberType]` on Pillow's
# deferred-import Image.load / pypdfium2 members is load-bearing internally,
# but the export's fuller stub set resolves the member, flagging the ignore as
# unnecessary. The ignore must stay in source, so relax the rule here.
reportUnnecessaryTypeIgnoreComment = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportPrivateLocalImportUsage = false

[tool.ty.src]
exclude = [
    ".venv/",
    "*.egg-info/",
    ".pytest_cache/",
    "build/",
    "dist/",
    "typings/",
    "**/third_party/",
    "**/docs/",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = [
  "typings",
]

[tool.ty.terminal]
error-on-warning = true
# output-format = "concise"   # full concise gitlab github junit

[tool.ty.rules]
all = "warn"

[[tool.ty.overrides]]
include = ["typings/**"]

[tool.ty.overrides.rules]
all = "ignore"

[[tool.ty.overrides]]
include = ["*_test.py"]

[tool.ty.overrides.rules]
invalid-key = "ignore"

[tool.codespell]
# some_variable_with_typo = "connexion"  # codespell:ignore
builtin = "clear,rare,code"
ignore-words = ".codespell-ignore"
# Pre-commit exclude handles most skips. This covers direct CLI invocations.
# Don't add new folder paths here -- add them to .pre-commit-config.yaml's
# codespell exclude regex instead. This list is only for file patterns.
skip = "htmlcov,.doctrees,*.pyc,*.ico,*.png,*.jpg,*.PNG,*.inv,*.dot,*.css,*.egg-info,uv.lock,__pycache__,.git,.venv,typings,**/third_party/,*/web/data.js,*/web/*_useragents.txt"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.uv]
package = true
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.pip]
compile-bytecode = true

[tool.uv.sources]
# Github installs track wesearch main; PyPI installs use the floor above.
# Advance the lock with `uv lock --upgrade-package wesearch` -- plain `uv lock`
# leaves a branch source on its pinned SHA.
wesearch = { git = "https://github.com/rekursiv-ai/wesearch", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

