providers:
  anthropic:
    sends:
      [thinking_effort, thinking_budget, thinking_output, service_tier,
       cache_ttl_sec, manage_context_server_side]
    cache_ttl_sec: [300.0, 3600.0]
    retries_internally: true
    models:
      fable-5.1:
      fable-5.0:
      mythos-5.1:
      mythos-5.0:
      opus-5.5:
      opus-5.0:
      opus-4.8:
      opus-4.7:
      opus-4.6:
      opus-4.5:
      sonnet-5.5:
      sonnet-5.0:
      sonnet-4.6:
      sonnet-4.5:
      haiku-5.5:
      haiku-4.5:
  anthropic-cli:
    sends: [thinking_effort]
    # ``claude`` holds the conversation; what it compacts or prunes is its own.
    manage_context_server_side: [true]
    models:
      fable-5.1:
      fable-5.0:
      mythos-5.1:
      mythos-5.0:
      opus-5.5:
      opus-5.0:
