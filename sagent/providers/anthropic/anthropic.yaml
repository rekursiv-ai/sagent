sources:
  models: https://docs.anthropic.com/en/docs/about-claude/models
  pricing: https://docs.anthropic.com/en/docs/about-claude/pricing
  fast_mode: https://docs.anthropic.com/en/docs/build-with-claude/fast-mode
  vision: https://platform.claude.com/docs/en/build-with-claude/vision
  overview: https://platform.claude.com/docs/en/api/overview

roles:
  best: fable
  default: opus
  everyday: sonnet
  utility: haiku

reference:
  # What Claude Code sends each model unasked; read from its requests:
  # adaptive thinking, or a fixed budget to the models that lack it.
  thinking_effort_default: high
  thinking_budget_default: auto
  approx_chars_per_token: 2.38
  limits:
    max_request_tokens: 1_000_000
    max_response_tokens: 128_000
    max_request_bytes: 33_554_432
    max_image_edge_px: 2_576
    max_image_bytes: 7_500_000
    truncates_at_context: true
  thinking:
    effort: [low, medium, high, xhigh, max]
    budget: [none, auto]
    output: [none, text, redacted]

profiles:
  extended:
    approx_chars_per_token: 3.12
    limits:
      max_request_tokens: 1_000_000
      max_response_tokens: 128_000
      max_request_bytes: 33_554_432
      max_image_edge_px: 1_568
      max_image_bytes: 7_500_000
      truncates_at_context: true
    thinking:
      effort: [low, medium, high, max]
      budget: [none, auto, fixed]
      output: [none, text, redacted]

  extended_200k:
    thinking_budget_default: fixed
    approx_chars_per_token: 3.12
    limits:
      max_request_tokens: 200_000
      max_response_tokens: 64_000
      max_request_bytes: 33_554_432
      max_image_edge_px: 1_568
      max_image_bytes: 7_500_000
      truncates_at_context: true
    thinking:
      effort: [low, medium, high]
      budget: [none, fixed]
      output: [none, text, redacted]

  fixed:
    thinking_effort_default: none
    thinking_budget_default: fixed
    approx_chars_per_token: 3.12
    limits:
      max_request_tokens: 200_000
      max_response_tokens: 64_000
      max_request_bytes: 33_554_432
      max_image_edge_px: 1_568
      max_image_bytes: 7_500_000
      truncates_at_context: true
    thinking:
      effort: [none]
      budget: [none, fixed]
      output: [none, text, redacted]

