providers:
  google:
    retries_internally: true
    models:
      gemini-argon-4.0:
      gemini-pro-3.1:
      gemini-pro-2.5:
      gemini-flash-3.8:
      gemini-flash-3.6:
      gemini-flash-3.0:
      gemini-flash-2.5:
      gemini-flash-lite-3.5:
      gemini-flash-lite-3.1:
      gemini-flash-lite-2.5:
  # ``agy``, as ``agy models`` listed them on 2026-10-27: 3.8 Flash alone, its effort
  # the id's suffix (``gemini-3.8-flash-high``).
  google-cli:
    roles:
      default: gemini-flash
      best: gemini-flash
      utility: gemini-flash
    # ``agy`` starts 3.8 Flash at its first-listed level, high.
    thinking_effort_default: high
    thinking_budget_default: none
    thinking:
      effort: [low, medium, high]
      budget: [none]
      output: [none]
    manage_context_server_side: [true]
    account_auth: true
    models:
      gemini-flash-3.8:
