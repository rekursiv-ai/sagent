- model_id: gemini-flash-lite-3.5
  wire_model_id: gemini-3.5-flash-lite
  thinking_effort_default: min
  prices:
  - service_tier: auto
    request: 0.3
    response: 2.5
    cache_write: 0.0
    cache_write_1h: 0.0
    cache_read: 0.03

- model_id: gemini-flash-lite-3.1
  wire_model_id: gemini-3.1-flash-lite
  thinking_effort_default: min
  knowledge_cutoff: January 2025
  prices:
  - service_tier: auto
    request: 0.25
    response: 1.5
    cache_write: 0.0
    cache_write_1h: 0.0
