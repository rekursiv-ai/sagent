sources:
  chat: https://platform.kimi.ai/docs/pricing/chat
  models: https://platform.kimi.ai/docs/models
  use_thinking_models: https://platform.kimi.ai/docs/guide/use-thinking-models
  kimi_k3_quickstart: https://platform.kimi.ai/docs/guide/kimi-k3-quickstart
  kimi_k2_6_quickstart: https://platform.kimi.ai/docs/guide/kimi-k2-6-quickstart

roles:
  default: kimi-3.0
  utility: kimi-2.6
  best: kimi-3.0
  everyday: kimi-3.0

reference:
  thinking_effort_default: none
  thinking_budget_default: none
  # The API lowers a max_tokens past the window to the room left (Chat
  # Completions reference, max_completion_tokens).
  limits:
    max_request_tokens: 262_144
    max_response_tokens: 32_768
    max_request_bytes: 104_857_600
    truncates_at_context: true
  thinking:
    effort: [none]
    budget: [none]
    output: [none, text]

profiles:
  # Kimi Code sends K3 no effort, and K3 is then served at high.
  k3:
    effort_as_level: true
    thinking_effort_default: high
    limits:
      max_request_tokens: 1_048_576
      max_response_tokens: 1_048_576
      max_request_bytes: 104_857_600
      truncates_at_context: true
    thinking:
      effort: [low, high, max]
      budget: [none]
      output: [none, text]

  # K2.6's ``thinking.type`` defaults to ``enabled``.
  hybrid:
    thinking_budget_default: auto
    thinking:
      effort: [none]
      budget: [none, auto]
      output: [none, text]

models:
- model_id: kimi-3.0
  wire_model_id: kimi-k3
  profile: k3
  prices:
  - service_tier: auto
    request: 3.0
    response: 15.0
    cache_write: 3.0
    cache_write_1h: 6.0
    cache_read: 0.3

- model_id: kimi-2.6
  wire_model_id: kimi-k2.6
  profile: hybrid
  prices:
  - service_tier: auto
    request: 0.95
    response: 4.0
    cache_write: 0.0
    cache_write_1h: 0.0
    cache_read: 0.16

- model_id: kimi-code-2.7
  wire_model_id: kimi-k2.7-code
  prices:
  - service_tier: auto
    request: 0.95
    response: 4.0
    cache_write: 0.0
    cache_write_1h: 0.0
    cache_read: 0.19

- model_id: kimi-code-highspeed-2.7
  wire_model_id: kimi-k2.7-code-highspeed
  prices:
  - service_tier: auto
    request: 1.9
    response: 8.0
    cache_write: 0.0
    cache_write_1h: 0.0
    cache_read: 0.38

providers:
  moonshot:
    retries_internally: true
    service_tier: [auto]
    manage_context_server_side: [false]
    models:
      kimi-3.0:
      kimi-2.6:
      kimi-code-2.7:
      kimi-code-highspeed-2.7:
