sources:
  models: https://developers.openai.com/api/docs/models/<model>
  pricing: https://developers.openai.com/api/docs/pricing
  images_vision: https://developers.openai.com/api/docs/guides/images-vision

roles:
  best: astra
  default: sol
  everyday: sol
  utility: luna

reference:
  # What Codex picks unasked where it serves the model, else the API's own.
  # A model that can reason does unasked; the wire has no budget to send.
  thinking_effort_default: medium
  thinking_budget_default: auto
  approx_chars_per_token: 3.71
  # A 1.05M window takes input only up to the room a full reply needs, whatever
  # max_output_tokens says; a reply asked past the window is served and cut.
  limits:
    max_request_tokens: 921_000
    max_context_tokens: 1_050_000
    max_response_tokens: 128_000
    max_request_bytes: 536_870_912
    max_image_edge_px: 65_535
    truncates_at_context: true
  thinking:
    effort: [none]
    budget: [none]
    output: [none]

