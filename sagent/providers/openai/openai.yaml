      max_context_tokens: 0
      max_response_tokens: 32_768
      max_request_bytes: 536_870_912
      max_image_edge_px: 2_048
      truncates_at_context: true

  # Efforts measured 2026-11-18 (a refused effort is a 400 from the free
  # input_tokens count), and each default as a reply sent none reported it;
  # no window was measured, so no truncation is claimed.
  gpt_5:
    limits:
      max_request_tokens: 272_000
