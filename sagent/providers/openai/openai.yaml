# The ChatGPT endpoint serves 32k out and no tier but priority beyond the default;
# it takes 272k in, except the models measured to take their 1.05M window.
providers:
  openai:
    sends: [thinking_effort, thinking_output, service_tier]
    # What a cache lasts unasked; none is sent. GPT-5.6 and later keep at least 30
    # minutes; earlier models with extended retention keep about as long.
    cache_ttl_sec: [1800.0]
    retries_internally: true
    # Measured 2026-11-19, Chat Completions and Responses: two adjacent user turns
    # count 4 tokens more than the same text in one, so each stays its own.
    keeps_user_turns_apart: true
    models:
      # A model off OpenAI's extended-retention list keeps its cache in memory,
      # 5 to 10 idle minutes.
      gpt-pro-5.4: &in_memory
        cache_ttl_sec: [300.0]
      gpt-mini-5.4: *in_memory
      gpt-nano-5.4: *in_memory
      gpt-pro-5.2: *in_memory
      gpt-pro-5.0: *in_memory
      gpt-mini-5.0: *in_memory
      gpt-nano-5.0: *in_memory
      o-3.0: *in_memory
      o-pro-3.0: *in_memory
      gpt-mini-4.1: *in_memory
      gpt-omni-4.0: *in_memory
      gpt-omni-mini-4.0: *in_memory
  openai-sub:
    sends: [thinking_effort, thinking_output, service_tier]
    # Measured from journals: no misses up to 30 minutes, 1 in 11 at 30 to 60.
    cache_ttl_sec: [3600.0]
    retries_internally: true
    account_auth: true
    service_tier: [auto, priority]
    # No window is stated; unmeasured whether 272k in leaves room for 32k out.
    limits:
      max_request_tokens: 272_000
      max_context_tokens: 0
      max_response_tokens: 32_000
      max_request_bytes: 536_870_912
      max_image_edge_px: 65_535
      truncates_at_context: true
    models:
      # Bsearched 2026-11-18: the most input tokens served, by the server's
      # count; one more was refused (ContextOverflowError), as was 1,000,000.
      # The 32k reply and byte and image limits are the section's, not re-measured.
      astra-6.2: &sub_1m_6_2
        limits:
          max_request_tokens: 921_624
          max_context_tokens: 1_050_000
          max_response_tokens: 32_000
          max_request_bytes: 536_870_912
          max_image_edge_px: 65_535
          truncates_at_context: true
      sol-6.2: *sub_1m_6_2
      astra-6.0: &sub_1m_6_0
        limits:
          max_request_tokens: 921_858
          max_context_tokens: 1_050_000
          max_response_tokens: 32_000
          max_request_bytes: 536_870_912
          max_image_edge_px: 65_535
          truncates_at_context: true
      sol-6.1: *sub_1m_6_0
