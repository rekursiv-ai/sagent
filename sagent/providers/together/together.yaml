sources:
  model: https://docs.together.ai/docs/gpt-oss
  models: https://docs.together.ai/docs/serverless-models
  reasoning: https://docs.together.ai/docs/inference/chat/reasoning
  context: https://docs.together.ai/reference/chat-completions

roles:
  default: gpt-oss-120b-1.0
  utility: gpt-oss-120b-1.0
  best: gpt-oss-120b-1.0
  everyday: gpt-oss-120b-1.0

reference:
  effort_as_level: true
  thinking_effort_default: medium
  limits:
    max_request_tokens: 131_072
    max_response_tokens: 0
    truncates_at_context: false
  thinking:
    effort: [low, medium, high]
    budget: [none]
    output: [text]

models:
- model_id: gpt-oss-120b-1.0
  wire_model_id: openai/gpt-oss-120b
  prices:
  - service_tier: auto
    request: 0.15
    response: 0.6
    cache_read: 0.15

providers:
  together:
    sends: [thinking_effort]
    retries_internally: true
    service_tier: [auto]
    manage_context_server_side: [false]
    models:
      gpt-oss-120b-1.0:
