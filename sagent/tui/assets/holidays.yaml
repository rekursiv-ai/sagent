# Holidays in calendar order. `starts` is a fixed MM-DD or the name of a
# date rule in holiday.py. A holiday shows on its main day (Hanukkah's first
# eve, Kwanzaa's first day); on a weekend, Friday to Sunday. Each icon is 11x12
# pixels.
# Letters name colors: R red, O orange, Y yellow or gold, G green,
# C teal, B blue, V violet, P pink, M magenta, N brown, T tan,
# W white, S silver or gray, K black. Lowercase is a second shade of the
# same color. `.` is clear.
#
# A holiday is here if it has at least 100M observers worldwide, is a US
# federal holiday, is a date that spells something (an in-joke), or starts a
# Northern Hemisphere season. Three exceptions fall below 100M: Hanukkah,
# Vaisakhi, and Kwanzaa. Each holiday's `why` names its reason.
# Solemn days (Yom Kippur, Good Friday, Ashura) are left out on purpose: a
# playful logo does not belong on a day of mourning or fasting.
# Additions that meet this rule are welcome.

- name: "New Year's"
  starts: 01-01
  why: "US federal holiday."
  icons:
    - name: "fireworks"
      palette: {B: "#4da6ff", R: "#ff4d4d", S: "#888888", W: "#ffffff", Y: "#ffd23f"}
      pixels: |
        ...R.B.R...
        .B.......B.
        R...Y.Y...R
        ...Y...Y...
        B.Y..W..Y.B
        ....WWW....
        B.Y..W..Y.B
        ...Y...Y...
        R...Y.Y...R
        .B.......B.
        ...R.B.R...
        ...........
    - name: "champagne toast"
      palette: {S: "#8f99a5", W: "#fffbe6", Y: "#ffd23f", y: "#f4c542"}
      pixels: |
        .....Y.....
        ...Y.Y.Y...
        .S..S.S..S.
        .SyyS.SyyS.
        .SyWS.SWyS.
        .SWyS.SyWS.
        .SyyS.SyyS.
        ..SS...SS..
        ...S...S...
        ...S...S...
        ..SSS.SSS..
        ...........

